<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffd400">
<title>STEMEDU32</title>
<style>
  :root{
    --amarelo:#ffc61a; --amarelo-esc:#c99700;
    --rosa:#ff4fc8;    --rosa-esc:#b8238c;
    --fundo:#fff8e6;
    --texto:#333;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:var(--fundo);color:var(--texto);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;height:100dvh}

  /* barra superior */
  header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--amarelo)}
  header h1{font-size:18px;margin:0;flex:1}
  .btn{border:0;border-radius:14px;min-width:48px;height:48px;padding:0 12px;font-size:22px;
    background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2);cursor:pointer}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
  .btn.ligado{background:#5bd65b}

  /* simulador */
  #sim{flex:0 0 38%;min-height:160px;position:relative}
  #sim iframe{border:0;width:100%;height:100%;display:block}

  /* workspace: área livre que rola nos dois sentidos e cresce com os blocos */
  #ws{flex:1 1 auto;min-height:150px;overflow:auto;background:#fff;
    background-image:radial-gradient(#e6dcc0 1.5px,transparent 1.5px);background-size:24px 24px;
    border-top:4px solid #f0e2b8;touch-action:pan-x pan-y}
  #wsInterno{position:relative}
  .cadeia{position:absolute;display:flex;align-items:flex-start}

  /* paleta */
  #paleta{flex:0 0 auto;display:flex;gap:2px;overflow-x:auto;padding:8px 8px 12px;background:#ffe9f7;
    border-top:4px solid #f5c6e6;transition:background .15s}
  #paleta.lixo{background:#ffb3b3}

  /* bloco */
  .bloco{position:relative;width:86px;height:96px;flex:0 0 auto;margin-left:-12px;touch-action:none;cursor:grab}
  .bloco:first-child,#paleta .bloco{margin-left:0}
  .bloco svg{position:absolute;left:0;top:0;width:86px;height:64px;overflow:visible}
  .bloco .num{position:absolute;left:14px;top:56px;width:46px;height:32px;border-radius:16px;
    background:#fff;border:3px solid var(--rosa-esc);font:700 20px/26px system-ui;text-align:center}
  .bloco.ativo svg{filter:drop-shadow(0 0 6px #00b7ff) drop-shadow(0 0 6px #00b7ff)}
  .bloco.arrastando{opacity:.25}
  .fantasma{position:fixed;z-index:10;pointer-events:none;opacity:.85;display:flex;align-items:flex-start}
  .marcador{position:absolute;width:6px;height:64px;border-radius:3px;background:#00b7ff;pointer-events:none}

  /* lua */
  #lua{position:fixed;inset:auto 12px 12px 12px;max-height:50vh;overflow:auto;background:#222;color:#9f9;
    font:14px/1.4 ui-monospace,Consolas,monospace;border-radius:12px;padding:12px;white-space:pre;
    display:none;z-index:20;user-select:text;-webkit-user-select:text}
  #lua.aberto{display:block}
  #aviso{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#333;color:#fff;
    padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;z-index:30;pointer-events:none}
  #aviso.mostrar{opacity:1}
</style>
</head>
<body>

<header>
  <h1>STEMEDU32</h1>
  <button class="btn" id="btnLua" title="Ver código Lua">{ }</button>
  <button class="btn" id="btnConectar" title="Conectar robô">🔌</button>
  <button class="btn" id="btnParar" title="Parar">⏹</button>
</header>

<div id="sim"><iframe id="simFrame" src="simulador.html" title="Simulador 3D"></iframe></div>

<div id="ws"><div id="wsInterno"></div></div>
<div id="paleta"></div>

<pre id="lua"></pre>
<div id="aviso"></div>

<script>
// =====================================================================
// 1. DEFINIÇÃO DOS BLOCOS
//    Para criar um bloco novo: adicionar aqui (cor, ícone, como vira Lua).
// =====================================================================
const CORES = {
  inicio:   ['var(--amarelo)', 'var(--amarelo-esc)'],
  movimento:['var(--rosa)',    'var(--rosa-esc)'],
};
// blocos de função: a cor liga a chamada à sequência que ela executa
const CORES_FUNCAO = {
  vermelho:['#ff5a4f', '#b3261e'],
  azul:    ['#3d8bff', '#1a56b8'],
  verde:   ['#2fbf5b', '#1b7a37'],
  roxo:    ['#9b5cff', '#5e2bb8'],
};
const LISTA_CORES = Object.keys(CORES_FUNCAO);

// ícones desenhados em SVG (centro do bloco ~ x=36, y=32)
const ICONES = {
  play:     '<path d="M30 18 L52 32 L30 46 Z" fill="#3ec43e" stroke="#1d7a1d" stroke-width="3" stroke-linejoin="round"/>',
  frente:   '<path d="M36 14 L50 30 H41 V50 H31 V30 H22 Z" fill="#fff"/>',
  tras:     '<path d="M36 50 L50 34 H41 V14 H31 V34 H22 Z" fill="#fff"/>',
  esquerda: '<path d="M46 44 A13 13 0 1 0 26 30" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M17 26 L28 18 L32 32 Z" fill="#fff"/>',
  direita:  '<path d="M26 44 A13 13 0 1 1 46 30" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M55 26 L44 18 L40 32 Z" fill="#fff"/>',
  // chapéu de função: "f" grande (começo da sequência da função)
  funcao:   '<text x="44" y="46" font-size="38" font-weight="800" font-style="italic" font-family="Georgia,serif" fill="#fff" text-anchor="middle">f</text>',
  // chamar função: "f" + seta "pula para lá"
  chamar:   '<text x="28" y="46" font-size="34" font-weight="800" font-style="italic" font-family="Georgia,serif" fill="#fff" text-anchor="middle">f</text><path d="M38 40 Q44 22 56 24" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M52 15 L62 25 L50 31 Z" fill="#fff"/>',
};

// chapeu: true = só pode começar uma sequência (não encaixa no meio)
const BLOCOS = {
  play:     { grupo:'inicio',    icone:'play',     chapeu:true },
  frente:   { grupo:'movimento', icone:'frente',   n:1 },
  tras:     { grupo:'movimento', icone:'tras',     n:1 },
  esquerda: { grupo:'movimento', icone:'esquerda', n:1 },
  direita:  { grupo:'movimento', icone:'direita',  n:1 },
  funcao:   { grupo:'funcao',    icone:'funcao',   chapeu:true, cor:'vermelho' },
  chamar:   { grupo:'funcao',    icone:'chamar',   cor:'vermelho' },
};
const MOVIMENTOS = ['frente', 'tras', 'esquerda', 'direita'];

// formatos (encaixe tipo quebra-cabeça: dente à direita, cavidade à esquerda)
const DENTE = 'V20 C80 20 84 26 84 32 C84 38 80 44 72 44 V56 Q72 64 64 64';
const FORMA_MEIO   = `M8 0 H64 Q72 0 72 8 ${DENTE} H8 Q0 64 0 56 V44 C8 44 12 38 12 32 C12 26 8 20 0 20 V8 Q0 0 8 0 Z`;
const FORMA_INICIO = `M32 0 H64 Q72 0 72 8 ${DENTE} H32 A32 32 0 0 1 32 0 Z`;
const PASSO = 74;          // distância horizontal entre blocos encaixados (86 - 12)
const ALT_BLOCO = 96;
const ENCAIXE = 40;        // distância (px) para "grudar" num encaixe

// =====================================================================
// 2. ESTADO
//    O workspace é uma lista de cadeias (sequências de blocos) soltas.
// =====================================================================
let proxId = 1;
const novoBloco = (tipo, extra = {}) => ({ id: proxId++, tipo, n: BLOCOS[tipo].n, cor: BLOCOS[tipo].cor, ...extra });

let cadeias = [ { x: 20, y: 20, blocos: [ novoBloco('play') ] } ];
let ultimaCadeia = cadeias[0];   // onde o toque na paleta adiciona

const ws = document.getElementById('ws');
const wsInterno = document.getElementById('wsInterno');
const paleta = document.getElementById('paleta');

// =====================================================================
// 3. DESENHO
// =====================================================================
function criarBlocoEl(b) {
  const def = BLOCOS[b.tipo];
  const [cor, borda] = def.grupo === 'funcao' ? CORES_FUNCAO[b.cor] : CORES[def.grupo];
  const el = document.createElement('div');
  el.className = 'bloco';
  el.dataset.tipo = b.tipo;
  if (b.id) el.dataset.id = b.id;
  el.innerHTML =
    `<svg viewBox="0 0 86 64"><path d="${def.chapeu ? FORMA_INICIO : FORMA_MEIO}"
       fill="${cor}" stroke="${borda}" stroke-width="3"/>${ICONES[def.icone]}</svg>` +
    (def.n !== undefined ? `<div class="num">${b.n}</div>` : '');
  return el;
}

const larguraCadeia = c => (c.blocos.length - 1) * PASSO + 86;

function desenhar() {
  arrumar();
  wsInterno.innerHTML = '';
  let maxX = 0, maxY = 0;
  cadeias.forEach((c, ci) => {
    const el = document.createElement('div');
    el.className = 'cadeia';
    el.style.left = c.x + 'px';
    el.style.top = c.y + 'px';
    c.blocos.forEach((b, bi) => {
      const be = criarBlocoEl(b);
      be.dataset.c = ci; be.dataset.b = bi;
      el.appendChild(be);
    });
    wsInterno.appendChild(el);
    maxX = Math.max(maxX, c.x + larguraCadeia(c));
    maxY = Math.max(maxY, c.y + ALT_BLOCO);
  });
  // espaço extra para a criança sempre ter onde soltar blocos
  wsInterno.style.width  = Math.max(ws.clientWidth,  maxX + 200) + 'px';
  wsInterno.style.height = Math.max(ws.clientHeight, maxY + 150) + 'px';
  document.getElementById('lua').textContent = gerarLua();
}

// remove cadeias vazias e empurra tudo se algo ficou em coordenada negativa
function arrumar() {
  cadeias = cadeias.filter(c => c.blocos.length);
  if (!cadeias.includes(ultimaCadeia)) ultimaCadeia = cadeias[0] || null;
  const minX = Math.min(...cadeias.map(c => c.x)), minY = Math.min(...cadeias.map(c => c.y));
  const dx = minX < 12 ? 12 - minX : 0, dy = minY < 12 ? 12 - minY : 0;
  if (dx || dy) {
    cadeias.forEach(c => { c.x += dx; c.y += dy; });
    ws.scrollLeft += dx; ws.scrollTop += dy;   // mantém a vista no mesmo lugar
  }
}

Object.keys(BLOCOS).forEach(t => paleta.appendChild(criarBlocoEl({ tipo: t, n: BLOCOS[t].n, cor: BLOCOS[t].cor })));

// =====================================================================
// 4. EXECUÇÃO / GERAÇÃO DE LUA
// =====================================================================
const cadeiasPlay = () => cadeias.filter(c => c.blocos[0].tipo === 'play').sort((a, b) => a.y - b.y);

// lista plana de comandos para o simulador ({cmd, n, id} — id = bloco a destacar)
// Ao chegar num bloco "chamar", a execução pula para a sequência da função da mesma cor e depois volta.
const cadeiaFuncao = cor => cadeias.find(c => c.blocos[0].tipo === 'funcao' && c.blocos[0].cor === cor);
const MAX_PROFUNDIDADE = 8, MAX_COMANDOS = 300;   // proteção contra função que chama a si mesma

function comandos(cadeia, prof = 0, saida = []) {
  for (const b of cadeia.blocos) {
    if (saida.length >= MAX_COMANDOS) break;
    if (MOVIMENTOS.includes(b.tipo)) saida.push({ cmd: b.tipo, n: b.n, id: b.id });
    else if (b.tipo === 'chamar') {
      saida.push({ cmd: 'pular', id: b.id });
      const f = cadeiaFuncao(b.cor);
      if (f && prof < MAX_PROFUNDIDADE) {
        saida.push({ cmd: 'pular', id: f.blocos[0].id });
        comandos(f, prof + 1, saida);
      }
    }
  }
  return saida;
}

function luaDe(blocos, ind = '') {
  const linhas = [];
  for (const b of blocos) {
    if (MOVIMENTOS.includes(b.tipo)) linhas.push(`${ind}${b.tipo}(${b.n})`);
    else if (b.tipo === 'chamar') linhas.push(`${ind}f_${b.cor}()`);
  }
  return linhas;
}

function gerarLua(soPlay) {
  const linhas = ['-- programa STEMEDU32'];
  for (const cor of LISTA_CORES) {
    const f = cadeiaFuncao(cor);
    if (f) linhas.push('', `function f_${cor}()`, ...luaDe(f.blocos, '  '), 'end');
  }
  for (const c of soPlay ? [soPlay] : cadeiasPlay()) linhas.push('', '-- play', ...luaDe(c.blocos));
  return linhas.join('\n');
}

// =====================================================================
// 5. INTERAÇÃO: tocar e arrastar (pointer events = mouse + toque)
// =====================================================================
let arraste = null;
let marcador = null;

document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.bloco');
  if (!el || e.button > 0) return;
  const r = el.getBoundingClientRect();
  const daPaleta = paleta.contains(el);
  arraste = {
    daPaleta, el,
    ci: daPaleta ? -1 : +el.dataset.c, bi: daPaleta ? -1 : +el.dataset.b,
    tipo: el.dataset.tipo,
    x0: e.clientX, y0: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top,
    alvoNum: e.target.closest('.num'), fantasma: null,
  };
});

document.addEventListener('pointermove', e => {
  if (!arraste) return;
  const a = arraste;
  if (!a.fantasma) {
    if (Math.hypot(e.clientX - a.x0, e.clientY - a.y0) < 8) return;
    // arrastar do meio de uma cadeia leva o bloco e todos os seguintes
    a.blocos = a.daPaleta ? [novoBloco(a.tipo)] : cadeias[a.ci].blocos.slice(a.bi);
    a.fantasma = document.createElement('div');
    a.fantasma.className = 'fantasma';
    a.blocos.forEach(b => a.fantasma.appendChild(criarBlocoEl(b)));
    document.body.appendChild(a.fantasma);
    if (!a.daPaleta) [...a.el.parentNode.children].slice(a.bi).forEach(x => x.classList.add('arrastando'));
  }
  const fx = e.clientX - a.dx, fy = e.clientY - a.dy;
  a.fantasma.style.left = fx + 'px';
  a.fantasma.style.top  = fy + 'px';
  paleta.classList.toggle('lixo', !a.daPaleta && sobrePaleta(e));
  mostrarMarcador(sobrePaleta(e) ? null : acharEncaixe(fx, fy, a));
});

document.addEventListener('pointerup', e => {
  if (!arraste) return;
  const a = arraste; arraste = null;
  esconderMarcador(); paleta.classList.remove('lixo');
  if (!a.fantasma) { tocar(a); return; }   // foi só um toque

  const fx = parseFloat(a.fantasma.style.left), fy = parseFloat(a.fantasma.style.top);
  a.fantasma.remove();
  const encaixe = sobrePaleta(e) ? null : acharEncaixe(fx, fy, a);

  // tira os blocos da cadeia de origem
  if (!a.daPaleta) cadeias[a.ci].blocos.splice(a.bi);

  if (sobrePaleta(e)) {
    // soltou na paleta = apagar
  } else if (encaixe) {
    encaixe.cadeia.blocos.splice(encaixe.k, 0, ...a.blocos);
    if (encaixe.k === 0) encaixe.cadeia.x -= a.blocos.length * PASSO;
    ultimaCadeia = encaixe.cadeia;
  } else {
    const p = paraWs(fx, fy);
    ultimaCadeia = { x: p.x, y: p.y, blocos: a.blocos };
    cadeias.push(ultimaCadeia);
  }
  desenhar();
});

document.addEventListener('pointercancel', () => {
  arraste?.fantasma?.remove();
  arraste = null; esconderMarcador(); paleta.classList.remove('lixo'); desenhar();
});

function tocar(a) {
  if (a.daPaleta) {                        // toque na paleta = adiciona no fim da última cadeia usada
    const b = novoBloco(a.tipo);
    if (BLOCOS[a.tipo].chapeu || !ultimaCadeia) {
      const y = Math.max(0, ...cadeias.map(c => c.y + ALT_BLOCO)) + 12;
      cadeias.push(ultimaCadeia = { x: 20, y, blocos: [b] });
    } else ultimaCadeia.blocos.push(b);
    desenhar();
    rolarAte(ultimaCadeia);
    return;
  }
  const c = cadeias[a.ci], b = c.blocos[a.bi];
  ultimaCadeia = c;
  if (b.tipo === 'play') executar(c);
  else if (BLOCOS[b.tipo].grupo === 'funcao') {            // toque = troca a cor
    b.cor = LISTA_CORES[(LISTA_CORES.indexOf(b.cor) + 1) % LISTA_CORES.length];
    desenhar();
  }
  else if (a.alvoNum) { b.n = b.n % 9 + 1; desenhar(); }   // toque no número = 1..9
}

const sobrePaleta = e => e.clientY > paleta.getBoundingClientRect().top;

// converte coordenada da tela -> coordenada dentro do workspace
function paraWs(x, y) {
  const r = wsInterno.getBoundingClientRect();
  return { x: Math.round(x - r.left), y: Math.round(y - r.top) };
}

// procura um encaixe perto de (fx,fy) — posição de tela do 1º bloco arrastado
function acharEncaixe(fx, fy, a) {
  if (BLOCOS[a.blocos[0].tipo].chapeu) return null;     // chapéu só fica solto
  const p = paraWs(fx, fy);
  let melhor = null, dMelhor = ENCAIXE;
  cadeias.forEach((c, ci) => {
    // a cadeia de origem conta só com os blocos que ficaram
    const len = ci === a.ci ? a.bi : c.blocos.length;
    if (len === 0) return;
    for (let k = 0; k <= len; k++) {
      if (k === 0 && BLOCOS[c.blocos[0].tipo].chapeu) continue;   // não entra antes de um chapéu
      const sx = c.x + k * PASSO - (k === 0 ? a.blocos.length * PASSO : 0);
      const d = Math.hypot(p.x - sx, p.y - c.y);
      if (d < dMelhor) { dMelhor = d; melhor = { cadeia: c, k, mx: c.x + k * PASSO, my: c.y }; }
    }
  });
  return melhor;
}

function mostrarMarcador(enc) {
  if (!enc) { esconderMarcador(); return; }
  if (!marcador) { marcador = document.createElement('div'); marcador.className = 'marcador'; }
  marcador.style.left = (enc.mx - 3) + 'px';
  marcador.style.top = enc.my + 'px';
  wsInterno.appendChild(marcador);
}
function esconderMarcador() { marcador?.remove(); marcador = null; }

function rolarAte(c) {
  const el = wsInterno.querySelector(`.bloco[data-id="${c.blocos.at(-1).id}"]`);
  el?.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
}

// =====================================================================
// 6. SIMULADOR (iframe) — conversa por postMessage
// =====================================================================
const simFrame = document.getElementById('simFrame');
function paraSim(msg) { simFrame.contentWindow?.postMessage(msg, '*'); }
let emExecucao = [];   // comandos enviados (para saber qual bloco destacar)

addEventListener('message', ({ data }) => {
  if (!data?.tipo) return;
  if (data.tipo === 'passo') destacar(emExecucao[data.indice]?.id);
  if (data.tipo === 'fim') destacar(null);
});

function destacar(id) {
  wsInterno.querySelectorAll('.bloco').forEach(el => el.classList.toggle('ativo', +el.dataset.id === id));
}

function executar(cadeia) {
  emExecucao = comandos(cadeia);
  destacar(cadeia.blocos[0].id);
  paraSim({ tipo: 'executar', comandos: emExecucao.map(({ cmd, n }) => ({ cmd, n })) });
  if (porta) enviarParaRobo(cadeia);
}

document.getElementById('btnParar').onclick = () => {
  paraSim({ tipo: 'reiniciar' }); destacar(null);
  if (porta) escreverLinha('parar');
};
document.getElementById('btnLua').onclick = () =>
  document.getElementById('lua').classList.toggle('aberto');
addEventListener('resize', desenhar);

// =====================================================================
// 7. CONEXÃO COM O MICROCONTROLADOR (Web Serial — Chrome/Edge desktop e Android)
//    Protocolo: "inicio" \n  <linhas lua>  \n "fim"
// =====================================================================
let porta = null, escritor = null;

document.getElementById('btnConectar').onclick = async () => {
  if (porta) { await desconectar(); return; }
  if (!('serial' in navigator)) { aviso('Este navegador não suporta Web Serial (use Chrome/Edge)'); return; }
  try {
    porta = await navigator.serial.requestPort();
    await porta.open({ baudRate: 115200 });
    escritor = porta.writable.getWriter();
    document.getElementById('btnConectar').classList.add('ligado');
    aviso('Robô conectado!');
    lerRespostas();
  } catch (err) { porta = null; aviso('Não conectou: ' + err.message); }
};

async function desconectar() {
  try { escritor?.releaseLock(); await porta.close(); } catch {}
  porta = escritor = null;
  document.getElementById('btnConectar').classList.remove('ligado');
  aviso('Desconectado');
}

const codificador = new TextEncoder();
async function escreverLinha(t) { await escritor?.write(codificador.encode(t + '\n')); }

async function enviarParaRobo(cadeia) {
  await escreverLinha('inicio');
  for (const linha of gerarLua(cadeia).split('\n')) if (linha && !linha.startsWith('--')) await escreverLinha(linha);
  await escreverLinha('fim');
}

async function lerRespostas() {   // mostra no console o que o firmware responder
  const leitor = porta.readable.pipeThrough(new TextDecoderStream()).getReader();
  try { for (;;) { const { value, done } = await leitor.read(); if (done) break; console.log('[robô]', value); } }
  catch {} finally { leitor.releaseLock(); }
}

// =====================================================================
function aviso(t) {
  const a = document.getElementById('aviso');
  a.textContent = t; a.classList.add('mostrar');
  clearTimeout(aviso.t); aviso.t = setTimeout(() => a.classList.remove('mostrar'), 2200);
}

desenhar();
</script>
</body>
</html>
