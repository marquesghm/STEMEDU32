<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffd400">
<title>STEMEDU32</title>
<style>
  :root{
    --amarelo:#ffc61a; --amarelo-esc:#c99700;
    --rosa:#ff4fc8;    --rosa-esc:#b8238c;
    --fundo:#fff8e6;
    --texto:#333;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:var(--fundo);color:var(--texto);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;height:100dvh}

  /* barra superior */
  header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--amarelo)}
  header h1{font-size:18px;margin:0;flex:1}
  .btn{border:0;border-radius:14px;min-width:48px;height:48px;padding:0 12px;font-size:22px;
    background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2);cursor:pointer}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
  .btn.verde{background:#3ec43e;color:#fff}
  .btn.vermelho{background:#ff4b4b;color:#fff}

  /* menu hambúrguer */
  #menu{position:fixed;left:8px;top:62px;z-index:40;display:none;flex-direction:column;gap:4px;padding:6px;
    background:#fff;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);min-width:200px}
  #menu.aberto{display:flex}
  #menu button{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px;border:0;border-radius:10px;
    background:none;font:16px system-ui;color:var(--texto);cursor:pointer;text-align:left}
  #menu button:active{background:#fff3c4}
  #menu button span{width:28px;font-size:20px;text-align:center}
  #menu button.ligado{background:#d9f7d9}

  /* simulador */
  #sim{flex:0 1 38%;min-height:60px;position:relative}
  /* divisor arrastável entre simulador e workspace */
  #divisor{flex:0 0 auto;height:7px;background:#f0e2b8;display:flex;align-items:center;justify-content:center;
    touch-action:none;cursor:ns-resize;position:relative;z-index:2}
  #divisor::before{content:"";width:48px;height:3px;border-radius:2px;background:#c9b27a}
  #divisor::after{content:"";position:absolute;inset:-12px 0}   /* área de toque maior que a linha */
  #divisor.ativo{background:#e6d29a}
  body.redimensionando #simFrame{pointer-events:none}   /* iframe não "rouba" o dedo */
  #sim iframe{border:0;width:100%;height:100%;display:block}

  /* workspace: arrastar o fundo navega para qualquer direção (pan próprio, sem scroll nativo) */
  /* #ws = janela; #wsInterno = a "folha" do workspace (tamanho fixo, grande), que move e dá zoom */
  #ws{flex:1 1 auto;min-height:150px;overflow:hidden;position:relative;background:#e9e1c8;
    touch-action:none;cursor:move}
  #wsInterno{position:absolute;left:0;top:0;will-change:transform;transform-origin:0 0;background:#fff;
    background-image:radial-gradient(#e6dcc0 1.5px,transparent 1.5px);background-size:24px 24px;
    box-shadow:0 0 0 3px #d9cba3}
  #minimapa{position:absolute;right:8px;top:8px;width:96px;height:64px;border-radius:8px;z-index:3;
    background:rgba(255,255,255,.6);border:1.5px solid rgba(0,0,0,.15);opacity:0;pointer-events:none;
    transition:opacity .2s;cursor:zoom-out}
  #minimapa.visivel{opacity:.85;pointer-events:auto}
  .cadeia{position:absolute;display:flex;align-items:flex-start}

  /* paleta */
  /* paleta: rola deslizando o dedo para os lados (sem barra); bloco só sai puxando para cima */
  #paleta{flex:0 0 auto;display:flex;gap:2px;overflow:hidden;padding:8px 8px 12px;background:#ffe9f7;
    border-top:4px solid #f5c6e6;transition:background .15s;touch-action:none}
  #paleta.lixo{background:#ffb3b3}

  /* bloco */
  .bloco{position:relative;width:86px;height:96px;flex:0 0 auto;margin-left:-12px;touch-action:none;cursor:grab}
  .bloco:first-child,#paleta .bloco{margin-left:0}
  .bloco svg{position:absolute;left:0;top:0;width:86px;height:64px;overflow:visible}
  .bloco .num{position:absolute;left:14px;top:56px;width:46px;height:32px;border-radius:16px;
    background:#fff;border:3px solid var(--rosa-esc);font:700 20px/26px system-ui;text-align:center}
  /* dentro do construtor de cenários: só workspace + paleta */
  body.modo-cenario header, body.modo-cenario #sim, body.modo-cenario #divisor{display:none}
  body.simples .bloco .num{display:none}   /* modo simplificado: sem número */
  body.simples .bloco{height:68px}
  .bloco.ativo svg{filter:drop-shadow(0 0 6px #00b7ff) drop-shadow(0 0 6px #00b7ff)}
  .bloco.arrastando{opacity:.25}
  .fantasma{position:fixed;transform-origin:0 0;z-index:10;pointer-events:none;opacity:.85;display:flex;align-items:flex-start}
  .marcador{position:absolute;width:6px;height:64px;border-radius:3px;background:#00b7ff;pointer-events:none}

  /* menu de números do bloco */
  #menuNumero{position:fixed;z-index:25;display:none;grid-template-columns:repeat(5,44px);gap:6px;padding:8px;
    background:#fff;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.25);border:3px solid var(--rosa-esc)}
  #menuNumero.aberto{display:grid}
  #menuNumero button{width:44px;height:44px;border-radius:50%;border:2px solid #f0c4e4;background:#fff;
    font:700 20px system-ui;color:var(--texto);cursor:pointer;padding:0}
  #menuNumero button.atual{background:var(--rosa);border-color:var(--rosa-esc);color:#fff}
  #menuNumero button:active{transform:scale(.92)}

  /* lua */
  #lua{position:fixed;inset:auto 12px 12px 12px;max-height:50vh;overflow:auto;background:#222;color:#9f9;
    font:14px/1.4 ui-monospace,Consolas,monospace;border-radius:12px;padding:12px;white-space:pre;
    display:none;z-index:20;user-select:text;-webkit-user-select:text}
  #lua.aberto{display:block}
  #aviso{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#333;color:#fff;
    padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;z-index:30;pointer-events:none}
  #aviso.mostrar{opacity:1}
</style>
</head>
<body>

<header>
  <button class="btn" id="btnMenu" title="Menu">☰</button>
  <h1>STEMEDU32</h1>
  <button class="btn verde" id="btnPlay" title="Executar">▶</button>
  <button class="btn vermelho" id="btnParar" title="Parar">⏹</button>
</header>
<nav id="menu">
  <button id="btnConectar"><span>🔌</span><b>Conectar robô</b></button>
  <button id="btnLua"><span>{ }</span><b>Mostrar código</b></button>
  <button id="btnModo"><span>🧸</span><b>Modo simplificado</b></button>
  <button id="btnCenario"><span>🏗️</span><b>Construir cenário</b></button>
  <button id="btnLimpar"><span>🗑️</span><b>Limpar tudo</b></button>
</nav>

<div id="sim"><iframe id="simFrame" src="simulador.html" title="Simulador 3D"></iframe></div>

<div id="divisor" title="Arraste para mudar o tamanho"></div>
<div id="ws"><div id="wsInterno"></div><canvas id="minimapa" title="Ver todos os blocos"></canvas></div>
<div id="paleta"></div>

<div id="menuNumero"></div>
<pre id="lua"></pre>
<div id="aviso"></div>

<script>
// =====================================================================
// 1. DEFINIÇÃO DOS BLOCOS
//    Para criar um bloco novo: adicionar aqui (cor, ícone, como vira Lua).
// =====================================================================
const CORES = {
  inicio:   ['var(--amarelo)', 'var(--amarelo-esc)'],
  evento:   ['#ff9d1a', '#c46a00'],
  movimento:['var(--rosa)',    'var(--rosa-esc)'],
};
// blocos de função: a cor liga a chamada à sequência que ela executa
const CORES_FUNCAO = {
  vermelho:['#ff5a4f', '#b3261e'],
  azul:    ['#3d8bff', '#1a56b8'],
  verde:   ['#2fbf5b', '#1b7a37'],
  roxo:    ['#9b5cff', '#5e2bb8'],
};
const LISTA_CORES = Object.keys(CORES_FUNCAO);

// terrenos do cenário (mesmos nomes do simulador) e seus mini desenhos (dentro do quadrado 30..62 x 14..46)
const TERRENOS = ['parede', 'estrela', 'agua', 'chao_vermelho', 'chao_azul', 'chao_verde'];
const MINI_TERRENO = {
  parede:        '<rect x="34" y="18" width="24" height="24" fill="#8a8f99"/><path d="M34 26 H58 M34 34 H58 M46 18 V26 M40 26 V34 M52 26 V34 M46 34 V42" stroke="#5d626b" stroke-width="2"/>',
  estrela:       '<path d="M46 16 L50.5 26 L61 26.5 L53 33.5 L55.5 44 L46 38.5 L36.5 44 L39 33.5 L31 26.5 L41.5 26 Z" fill="#ffd400" stroke="#c99700" stroke-width="1.5" stroke-linejoin="round"/>',
  agua:          '<path d="M46 16 C52 26 57 31 57 36 A11 11 0 0 1 35 36 C35 31 40 26 46 16 Z" fill="#3aa0ff"/>',
  chao_vermelho: '<rect x="34" y="18" width="24" height="24" rx="3" fill="#ff5a4f"/>',
  chao_azul:     '<rect x="34" y="18" width="24" height="24" rx="3" fill="#3d8bff"/>',
  chao_verde:    '<rect x="34" y="18" width="24" height="24" rx="3" fill="#2fbf5b"/>',
};

const GIRO ='<path d="M47.2 41.2 A13 13 0 1 0 25 32" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>' +
             '<path d="M16 31 H34 L25 44 Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>';
// ícones desenhados em SVG (centro do bloco ~ x=36, y=32)
const ICONES = {
  play:     '<path d="M30 18 L52 32 L30 46 Z" fill="#3ec43e" stroke="#1d7a1d" stroke-width="3" stroke-linejoin="round"/>',
  frente:   '<path d="M36 14 L50 30 H41 V50 H31 V30 H22 Z" fill="#fff"/>',
  tras:     '<path d="M36 50 L50 34 H41 V14 H31 V34 H22 Z" fill="#fff"/>',
  // giro: arco (centro 38,32 raio 13) que termina dentro da ponta da seta, apontando na direção da curva
  esquerda: GIRO,
  direita:  `<g transform="translate(72 0) scale(-1 1)">${GIRO}</g>`,   // espelho da esquerda
  // chapéu de função: "f" grande (começo da sequência da função)
  funcao:   '<text x="44" y="46" font-size="38" font-weight="800" font-style="italic" font-family="Georgia,serif" fill="#fff" text-anchor="middle">f</text>',
  // chamar função: "f" + seta "pula para lá"
  // quando tocar: mãozinha + desenho do terreno (o desenho muda com o terreno do bloco)
  tocar:    b => `<rect x="30" y="14" width="32" height="32" rx="7" fill="#fff"/>${MINI_TERRENO[b.terreno]}` +
                 '<circle cx="28" cy="46" r="7" fill="#fff" stroke="#c46a00" stroke-width="2.5"/><circle cx="28" cy="46" r="2.5" fill="#c46a00"/>',
  chamar:   '<text x="28" y="46" font-size="34" font-weight="800" font-style="italic" font-family="Georgia,serif" fill="#fff" text-anchor="middle">f</text><path d="M38 40 Q44 22 56 24" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M52 15 L62 25 L50 31 Z" fill="#fff"/>',
};

// chapeu: true = só pode começar uma sequência (não encaixa no meio)
const BLOCOS = {
  play:     { grupo:'inicio',    icone:'play',     chapeu:true },
  frente:   { grupo:'movimento', icone:'frente',   n:1 },
  tras:     { grupo:'movimento', icone:'tras',     n:1 },
  esquerda: { grupo:'movimento', icone:'esquerda', n:1 },
  direita:  { grupo:'movimento', icone:'direita',  n:1 },
  funcao:   { grupo:'funcao',    icone:'funcao',   chapeu:true, cor:'vermelho' },
  chamar:   { grupo:'funcao',    icone:'chamar',   cor:'vermelho' },
  // "quando o robô tocar em [terreno]": começo de uma reação (toque no bloco troca o terreno)
  tocar:    { grupo:'evento',    icone:'tocar',    chapeu:true, terreno:'parede' },
};
const MOVIMENTOS = ['frente', 'tras', 'esquerda', 'direita'];

// formatos (encaixe tipo quebra-cabeça: dente à direita, cavidade à esquerda)
const DENTE = 'V20 C80 20 84 26 84 32 C84 38 80 44 72 44 V56 Q72 64 64 64';
const FORMA_MEIO   = `M8 0 H64 Q72 0 72 8 ${DENTE} H8 Q0 64 0 56 V44 C8 44 12 38 12 32 C12 26 8 20 0 20 V8 Q0 0 8 0 Z`;
const FORMA_INICIO = `M32 0 H64 Q72 0 72 8 ${DENTE} H32 A32 32 0 0 1 32 0 Z`;
const PASSO = 74;          // distância horizontal entre blocos encaixados (86 - 12)
const ALT_BLOCO = 96;
const ENCAIXE = 40;        // distância (px) para "grudar" num encaixe

// =====================================================================
// 2. ESTADO
//    O workspace é uma lista de cadeias (sequências de blocos) soltas.
// =====================================================================
let proxId = 1;
const novoBloco = (tipo, extra = {}) => ({ id: proxId++, tipo, n: BLOCOS[tipo].n, cor: BLOCOS[tipo].cor, terreno: BLOCOS[tipo].terreno, ...extra });

let cadeias = [ { x: 20, y: 20, blocos: [ novoBloco('play') ] } ];
let ultimaCadeia = cadeias[0];   // onde o toque na paleta adiciona

const ws = document.getElementById('ws');
const wsInterno = document.getElementById('wsInterno');
const paleta = document.getElementById('paleta');

// =====================================================================
// 3. DESENHO
// =====================================================================
function criarBlocoEl(b) {
  const def = BLOCOS[b.tipo];
  const [cor, borda] = def.grupo === 'funcao' ? CORES_FUNCAO[b.cor] : CORES[def.grupo];
  const el = document.createElement('div');
  el.className = 'bloco';
  el.dataset.tipo = b.tipo;
  if (b.id) el.dataset.id = b.id;
  el.innerHTML =
    `<svg viewBox="0 0 86 64"><path d="${def.chapeu ? FORMA_INICIO : FORMA_MEIO}"
       fill="${cor}" stroke="${borda}" stroke-width="3"/>${typeof ICONES[def.icone] === 'function' ? ICONES[def.icone](b) : ICONES[def.icone]}</svg>` +
    (def.n !== undefined ? `<div class="num">${b.n}</div>` : '');
  return el;
}

const larguraCadeia = c => (c.blocos.length - 1) * PASSO + 86;

function desenhar() {
  arrumar();
  wsInterno.innerHTML = '';
  cadeias.forEach((c, ci) => {
    const el = document.createElement('div');
    el.className = 'cadeia';
    el.style.left = c.x + 'px';
    el.style.top = c.y + 'px';
    c.blocos.forEach((b, bi) => {
      const be = criarBlocoEl(b);
      be.dataset.c = ci; be.dataset.b = bi;
      el.appendChild(be);
    });
    wsInterno.appendChild(el);
  });
  desenharVista();
  document.getElementById('lua').textContent = gerarLua();
  salvarPrograma();
}

// o programa fica salvo no navegador: é o mesmo na página de programar e no construtor de cenários
function salvarPrograma() {
  try { localStorage.setItem('programa', JSON.stringify({ cadeias, proxId })); } catch {}
}
function carregarPrograma() {
  try {
    const p = JSON.parse(localStorage.getItem('programa') || 'null');
    if (!p?.cadeias?.length) return;
    const validas = p.cadeias.filter(c => c.blocos?.length && c.blocos.every(b => BLOCOS[b.tipo]));
    if (!validas.length) return;
    cadeias = validas;
    proxId = Math.max(p.proxId || 1, ...cadeias.flatMap(c => c.blocos.map(b => b.id + 1)));
    ultimaCadeia = cadeias[0];
  } catch {}
}

function arrumar() {
  cadeias = cadeias.filter(c => c.blocos.length);
  if (simples) sincronizarFuncoes();
  // nenhuma cadeia sai da folha
  for (const c of cadeias) {
    c.x = limitar(c.x, 8, Math.max(8, WS_L - larguraCadeia(c) - 8));
    c.y = limitar(c.y, 8, WS_A - ALT_BLOCO - 8);
  }
  if (!cadeias.includes(ultimaCadeia)) ultimaCadeia = cadeias[0] || null;
}

// Modo simplificado: o início de função não fica na paleta. Ele aparece sozinho
// (abaixo do Play) quando um bloco "chamar" de uma cor entra no workspace, e some
// se ficar vazio e ninguém mais chamar aquela cor.
function sincronizarFuncoes() {
  const cores = new Set(cadeias.flatMap(c => c.blocos).filter(b => b.tipo === 'chamar').map(b => b.cor));
  cadeias = cadeias.filter(c => !(c.blocos[0].tipo === 'funcao' && c.blocos.length === 1 && !cores.has(c.blocos[0].cor)));
  for (const cor of LISTA_CORES) {
    if (!cores.has(cor) || cadeiaFuncao(cor)) continue;
    const play = cadeiasPlay()[0], x = play ? play.x : 20;
    let y = (play ? play.y : 8) + ALT_BLOCO + 12;
    // desce até achar uma linha livre (sem cadeia ocupando aquele espaço)
    const ocupado = y => cadeias.some(c => c.y < y + ALT_BLOCO && c.y + ALT_BLOCO > y &&
                                         c.x < x + 2 * PASSO && c.x + larguraCadeia(c) > x);
    while (ocupado(y)) y += ALT_BLOCO + 12;
    cadeias.push({ x, y, blocos: [novoBloco('funcao', { cor })] });
  }
}

// ---------- vista (pan) ----------
// O workspace é uma folha grande de tamanho fixo. A vista desloca por (vistaX, vistaY)
// sem nunca passar da borda da folha; os blocos também ficam sempre dentro dela.
const WS_L = 4000, WS_A = 3000;
wsInterno.style.width = WS_L + 'px';
wsInterno.style.height = WS_A + 'px';
let vistaX = 0, vistaY = 0;

// limite da vista: a folha sempre cobre a janela (se a folha ficar menor que a janela, centraliza)
function limitarVista() {
  const w = ws.clientWidth, h = ws.clientHeight, fl = WS_L * zoom, fa = WS_A * zoom;
  vistaX = fl > w ? limitar(vistaX, w - fl, 0) : (w - fl) / 2;
  vistaY = fa > h ? limitar(vistaY, h - fa, 0) : (h - fa) / 2;
}

// ---------- zoom ----------
let zoom = 1;
const ZOOM_MIN = 0.4, ZOOM_MAX = 2;

// muda o zoom mantendo parado o ponto (px, py) da tela (relativo ao workspace)
function zoomEm(novo, px, py) {
  novo = limitar(novo, ZOOM_MIN, ZOOM_MAX);
  vistaX = px - (px - vistaX) * novo / zoom;
  vistaY = py - (py - vistaY) * novo / zoom;
  zoom = novo;
}

// posição de um ponto da tela relativa ao canto do workspace
function pontoWs(x, y) {
  const r = ws.getBoundingClientRect();
  return { x: x - r.left - ws.clientLeft, y: y - r.top - ws.clientTop };
}

const limitar = (v, a, b) => Math.min(b, Math.max(a, v));

function desenharVista() {
  limitarVista();
  wsInterno.style.transform = `translate(${vistaX}px, ${vistaY}px) scale(${zoom})`;
  atualizarMinimapa();
}

function moverVista(dx, dy) { vistaX += dx; vistaY += dy; desenharVista(); }

let animVolta = 0;   // animação de vista em andamento (minimapa)

// ---------- modo simplificado ----------
// Blocos sem número (cada um faz uma ação só, n = 1) e um único Play, já no workspace e fora da paleta.
let simples = false;
const valorN = b => simples ? 1 : b.n;

// ---------- modo cenário: este editor dentro do cenario.html (index.html?modo=cenario) ----------
// Sem header e sem simulador próprio: o simulador é o do construtor, e as mensagens vão pela página de cima.
const MODO_CENARIO = new URLSearchParams(location.search).get('modo') === 'cenario';
if (MODO_CENARIO) document.body.classList.add('modo-cenario');

// o bloco "quando tocar" aparece na paleta no construtor, ou se já existe um cenário montado
const temCenario = () => { try { return Object.keys(JSON.parse(localStorage.getItem('cenario') || '{}')).length > 0; } catch { return false; } };

function montarPaleta() {
  paleta.innerHTML = '';
  Object.keys(BLOCOS)
    .filter(t => !(simples && (t === 'play' || t === 'funcao')))
    .filter(t => t !== 'tocar' || MODO_CENARIO || temCenario())
    .forEach(t => paleta.appendChild(criarBlocoEl({ tipo: t, n: BLOCOS[t].n, cor: BLOCOS[t].cor, terreno: BLOCOS[t].terreno })));
}

function definirModoSimples(ligar) {
  simples = ligar;
  document.body.classList.toggle('simples', ligar);
  document.querySelector('#btnModo b').textContent = ligar ? 'Modo avançado' : 'Modo simplificado';
  if (ligar && !cadeias.some(c => c.blocos[0].tipo === 'play')) {
    // garante o Play: no canto de cima, acima de tudo que já existe
    const y = cadeias.length ? Math.min(...cadeias.map(c => c.y)) - ALT_BLOCO - 12 : 20;
    cadeias.unshift({ x: 20, y, blocos: [novoBloco('play')] });
    ultimaCadeia = cadeias[0];
  }
  try { localStorage.setItem('modo', ligar ? 'simples' : 'avancado'); } catch {}
  montarPaleta();
  desenhar();
}
montarPaleta();

// =====================================================================
// 4. EXECUÇÃO / GERAÇÃO DE LUA
// =====================================================================
const cadeiasPlay = () => cadeias.filter(c => c.blocos[0].tipo === 'play').sort((a, b) => a.y - b.y);

// lista plana de comandos para o simulador ({cmd, n, id} — id = bloco a destacar)
// Ao chegar num bloco "chamar", a execução pula para a sequência da função da mesma cor e depois volta.
const cadeiaFuncao = cor => cadeias.find(c => c.blocos[0].tipo === 'funcao' && c.blocos[0].cor === cor);
const MAX_PROFUNDIDADE = 8, MAX_COMANDOS = 300;   // proteção contra função que chama a si mesma

function comandos(cadeia, prof = 0, saida = []) {
  for (const b of cadeia.blocos) {
    if (saida.length >= MAX_COMANDOS) break;
    if (MOVIMENTOS.includes(b.tipo)) saida.push({ cmd: b.tipo, n: valorN(b), id: b.id });
    else if (b.tipo === 'chamar') {
      saida.push({ cmd: 'pular', id: b.id });
      const f = cadeiaFuncao(b.cor);
      if (f && prof < MAX_PROFUNDIDADE) {
        saida.push({ cmd: 'pular', id: f.blocos[0].id });
        comandos(f, prof + 1, saida);
      }
    }
  }
  return saida;
}

function luaDe(blocos, ind = '') {
  const linhas = [];
  for (const b of blocos) {
    if (MOVIMENTOS.includes(b.tipo)) linhas.push(`${ind}${b.tipo}(${valorN(b)})`);
    else if (b.tipo === 'chamar') linhas.push(`${ind}f_${b.cor}()`);
  }
  return linhas;
}

const cadeiaReacao = terreno => cadeias.find(c => c.blocos[0].tipo === 'tocar' && c.blocos[0].terreno === terreno);

function gerarLua(soPlay) {
  const linhas = ['-- programa STEMEDU32'];
  for (const cor of LISTA_CORES) {
    const f = cadeiaFuncao(cor);
    if (f) linhas.push('', `function f_${cor}()`, ...luaDe(f.blocos, '  '), 'end');
  }
  for (const t of TERRENOS) {
    const r = cadeiaReacao(t);
    if (r) linhas.push('', `function ao_tocar_${t}()`, ...luaDe(r.blocos, '  '), 'end');
  }
  for (const c of soPlay ? [soPlay] : cadeiasPlay()) linhas.push('', '-- play', ...luaDe(c.blocos));
  return linhas.join('\n');
}

// =====================================================================
// 5. INTERAÇÃO: tocar e arrastar (pointer events = mouse + toque)
// =====================================================================
let arraste = null;
// ângulo mínimo (graus acima da horizontal) para um movimento na paleta pegar o bloco em vez de rolar
const ANGULO_PEGAR = 20;
let marcador = null;

document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.bloco');
  if (e.button > 0) return;
  if (!el) {   // dedo no fundo da paleta: só pode rolar
    if (paleta.contains(e.target)) arraste = { daPaleta: true, el: null, x0: e.clientX, y0: e.clientY, fantasma: null };
    return;
  }
  const r = el.getBoundingClientRect();
  const daPaleta = paleta.contains(el);
  arraste = {
    daPaleta, el,
    ci: daPaleta ? -1 : +el.dataset.c, bi: daPaleta ? -1 : +el.dataset.b,
    tipo: el.dataset.tipo,
    x0: e.clientX, y0: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top,
    alvoNum: e.target.closest('.num'), fantasma: null,
  };
});

document.addEventListener('pointermove', e => {
  if (!arraste) return;
  const a = arraste;
  if (a.rolando) { paleta.scrollLeft = a.sl0 - (e.clientX - a.x0); return; }
  if (!a.fantasma) {
    const mx = e.clientX - a.x0, my = e.clientY - a.y0;
    if (Math.hypot(mx, my) < 8) return;
    // na paleta: puxar para cima (até bem na diagonal) pega o bloco; quase na horizontal rola a paleta
    const subindo = my < 0 && -my > Math.abs(mx) * Math.tan(ANGULO_PEGAR * Math.PI / 180);
    if (a.daPaleta && !(a.el && subindo)) {
      a.rolando = true; a.sl0 = paleta.scrollLeft; a.x0 = e.clientX;
      return;
    }
    // arrastar do meio de uma cadeia leva o bloco e todos os seguintes
    a.blocos = a.daPaleta ? [novoBloco(a.tipo)] : cadeias[a.ci].blocos.slice(a.bi);
    a.fantasma = document.createElement('div');
    a.fantasma.className = 'fantasma';
    // bloco arrastado do workspace mantém o tamanho do zoom; da paleta, ganha o zoom do workspace
    a.fantasma.style.transform = `scale(${zoom})`;
    if (a.daPaleta) { a.dx *= zoom; a.dy *= zoom; }
    a.blocos.forEach(b => a.fantasma.appendChild(criarBlocoEl(b)));
    document.body.appendChild(a.fantasma);
    if (!a.daPaleta) [...a.el.parentNode.children].slice(a.bi).forEach(x => x.classList.add('arrastando'));
  }
  const fx = e.clientX - a.dx, fy = e.clientY - a.dy;
  a.fantasma.style.left = fx + 'px';
  a.fantasma.style.top  = fy + 'px';
  paleta.classList.toggle('lixo', !a.daPaleta && sobrePaleta(e));
  mostrarMarcador(sobrePaleta(e) ? null : acharEncaixe(fx, fy, a));
});

document.addEventListener('pointerup', e => {
  if (!arraste) return;
  const a = arraste; arraste = null;
  esconderMarcador(); paleta.classList.remove('lixo');
  if (a.rolando || !a.el) return;          // rolou a paleta (ou tocou no fundo dela)
  if (!a.fantasma) { tocar(a); return; }   // foi só um toque

  const fx = parseFloat(a.fantasma.style.left), fy = parseFloat(a.fantasma.style.top);
  a.fantasma.remove();
  const encaixe = sobrePaleta(e) ? null : acharEncaixe(fx, fy, a);

  // modo simplificado: o único Play não pode ser apagado (volta para onde estava)
  if (simples && sobrePaleta(e) && a.blocos[0].tipo === 'play') { desenhar(); return; }

  // tira os blocos da cadeia de origem
  if (!a.daPaleta) cadeias[a.ci].blocos.splice(a.bi);

  if (sobrePaleta(e)) {
    // soltou na paleta = apagar
  } else if (encaixe) {
    encaixe.cadeia.blocos.splice(encaixe.k, 0, ...a.blocos);
    if (encaixe.k === 0) encaixe.cadeia.x -= a.blocos.length * PASSO;
    ultimaCadeia = encaixe.cadeia;
  } else {
    const p = paraWs(fx, fy);
    ultimaCadeia = { x: p.x, y: p.y, blocos: a.blocos };
    cadeias.push(ultimaCadeia);
  }
  desenhar();
});

document.addEventListener('pointercancel', () => {
  arraste?.fantasma?.remove();
  arraste = null; esconderMarcador(); paleta.classList.remove('lixo'); desenhar();
});

function tocar(a) {
  if (a.daPaleta) {                        // toque na paleta = adiciona no fim da última cadeia usada
    const b = novoBloco(a.tipo);
    if (BLOCOS[a.tipo].chapeu || !ultimaCadeia) {
      const y = Math.max(0, ...cadeias.map(c => c.y + ALT_BLOCO)) + 12;
      cadeias.push(ultimaCadeia = { x: 20, y, blocos: [b] });
    } else ultimaCadeia.blocos.push(b);
    desenhar();
    rolarAte(ultimaCadeia);
    return;
  }
  const c = cadeias[a.ci], b = c.blocos[a.bi];
  ultimaCadeia = c;
  if (b.tipo === 'play') executar(c);
  else if (b.tipo === 'tocar') {                           // toque = troca o terreno
    b.terreno = TERRENOS[(TERRENOS.indexOf(b.terreno) + 1) % TERRENOS.length];
    desenhar();
  }
  else if (b.tipo === 'chamar' || (b.tipo === 'funcao' && !simples)) {   // toque = troca a cor
    b.cor = LISTA_CORES[(LISTA_CORES.indexOf(b.cor) + 1) % LISTA_CORES.length];
    desenhar();
  }
  else if (a.alvoNum) abrirMenuNumero(b, a.alvoNum);      // toque no número = menu 0..9
}

// ---------- menu de números (0..9) que abre em cima da bolinha do bloco ----------
const menuNumero = document.getElementById('menuNumero');
for (let n = 0; n <= 9; n++) {
  const bt = document.createElement('button');
  bt.textContent = n; bt.dataset.n = n;
  menuNumero.appendChild(bt);
}
let blocoDoMenu = null;

function abrirMenuNumero(b, numEl) {
  blocoDoMenu = b;
  menuNumero.querySelectorAll('button').forEach(bt => bt.classList.toggle('atual', +bt.dataset.n === b.n));
  menuNumero.classList.add('aberto');
  // posiciona logo abaixo da bolinha (ou acima, se não couber), sem sair da tela
  const r = numEl.getBoundingClientRect(), m = menuNumero.getBoundingClientRect();
  let x = r.left + r.width / 2 - m.width / 2, y = r.bottom + 6;
  if (y + m.height > innerHeight - 8) y = r.top - m.height - 6;
  menuNumero.style.left = limitar(x, 8, innerWidth - m.width - 8) + 'px';
  menuNumero.style.top = Math.max(8, y) + 'px';
}
function fecharMenuNumero() { menuNumero.classList.remove('aberto'); blocoDoMenu = null; }

menuNumero.addEventListener('click', e => {
  const bt = e.target.closest('button');
  if (!bt || !blocoDoMenu) return;
  blocoDoMenu.n = +bt.dataset.n;
  fecharMenuNumero();
  desenhar();
});
// tocar fora fecha o menu (fase de captura: antes de qualquer outro gesto)
document.addEventListener('pointerdown', e => {
  if (blocoDoMenu && !menuNumero.contains(e.target)) fecharMenuNumero();
}, true);
menuNumero.addEventListener('pointerdown', e => e.stopPropagation());

const sobrePaleta = e => e.clientY > paleta.getBoundingClientRect().top;

// converte coordenada da tela -> coordenada dentro do workspace
function paraWs(x, y) {
  const r = wsInterno.getBoundingClientRect();
  return { x: Math.round((x - r.left) / zoom), y: Math.round((y - r.top) / zoom) };
}

// procura um encaixe perto de (fx,fy) — posição de tela do 1º bloco arrastado
function acharEncaixe(fx, fy, a) {
  if (BLOCOS[a.blocos[0].tipo].chapeu) return null;     // chapéu só fica solto
  const p = paraWs(fx, fy);
  let melhor = null, dMelhor = ENCAIXE;
  cadeias.forEach((c, ci) => {
    // a cadeia de origem conta só com os blocos que ficaram
    const len = ci === a.ci ? a.bi : c.blocos.length;
    if (len === 0) return;
    for (let k = 0; k <= len; k++) {
      if (k === 0 && BLOCOS[c.blocos[0].tipo].chapeu) continue;   // não entra antes de um chapéu
      const sx = c.x + k * PASSO - (k === 0 ? a.blocos.length * PASSO : 0);
      const d = Math.hypot(p.x - sx, p.y - c.y);
      if (d < dMelhor) { dMelhor = d; melhor = { cadeia: c, k, mx: c.x + k * PASSO, my: c.y }; }
    }
  });
  return melhor;
}

function mostrarMarcador(enc) {
  if (!enc) { esconderMarcador(); return; }
  if (!marcador) { marcador = document.createElement('div'); marcador.className = 'marcador'; }
  marcador.style.left = (enc.mx - 3) + 'px';
  marcador.style.top = enc.my + 'px';
  wsInterno.appendChild(marcador);
}
function esconderMarcador() { marcador?.remove(); marcador = null; }

function rolarAte(c) {
  // desloca a vista só o necessário para o último bloco da cadeia aparecer
  const z = zoom, x0 = c.x * z + vistaX, x = (c.x + larguraCadeia(c)) * z + vistaX;
  const y = c.y * z + vistaY, alt = ALT_BLOCO * z, w = ws.clientWidth, h = ws.clientHeight;
  moverVista(x > w - 20 ? w - 20 - x : (x0 < 0 ? -x0 + 20 : 0),
             y + alt > h ? h - alt - y : (y < 0 ? -y + 12 : 0));
}

// ---------- navegar: 1 dedo arrasta, 2 dedos = pinça (zoom); mouse: arrastar e roda ----------
const dedos = new Map();   // pointerId -> {x, y} dos dedos no fundo
let pan = null;            // estado do gesto atual (arrastar ou pinça)

function iniciarGesto() {
  const [a, b] = [...dedos.values()];
  if (b) {   // pinça: guarda distância inicial e o ponto do workspace entre os dedos
    const m = pontoWs((a.x + b.x) / 2, (a.y + b.y) / 2);
    pan = { pinca: true, d0: Math.hypot(a.x - b.x, a.y - b.y), z0: zoom,
            mundoX: (m.x - vistaX) / zoom, mundoY: (m.y - vistaY) / zoom };
  } else if (a) {
    pan = { x0: a.x, y0: a.y, vx: vistaX, vy: vistaY };
  } else pan = null;
}

ws.addEventListener('pointerdown', e => {
  if (e.target.closest('.bloco') || dedos.size >= 2) return;
  cancelAnimationFrame(animVolta);
  dedos.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { ws.setPointerCapture(e.pointerId); } catch {}
  iniciarGesto();
});
ws.addEventListener('pointermove', e => {
  if (!dedos.has(e.pointerId)) return;
  dedos.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pan.pinca) {
    const [a, b] = [...dedos.values()];
    const m = pontoWs((a.x + b.x) / 2, (a.y + b.y) / 2);
    zoom = limitar(pan.z0 * Math.hypot(a.x - b.x, a.y - b.y) / pan.d0, ZOOM_MIN, ZOOM_MAX);
    // o ponto que estava entre os dedos continua entre os dedos (também arrasta com 2 dedos)
    vistaX = m.x - pan.mundoX * zoom;
    vistaY = m.y - pan.mundoY * zoom;
  } else {
    vistaX = pan.vx + e.clientX - pan.x0;
    vistaY = pan.vy + e.clientY - pan.y0;
  }
  desenharVista();
});
const fimPan = e => {
  if (!dedos.delete(e.pointerId)) return;
  iniciarGesto();                 // saiu 1 dos 2 dedos: continua arrastando com o outro
};
ws.addEventListener('pointerup', fimPan);
ws.addEventListener('pointercancel', fimPan);
ws.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey) {   // Ctrl + roda (e pinça do touchpad) = zoom
    const p = pontoWs(e.clientX, e.clientY);
    zoomEm(zoom * Math.exp(-e.deltaY * 0.01), p.x, p.y);
    desenharVista();
  } else moverVista(-(e.shiftKey ? e.deltaY : e.deltaX), e.shiftKey ? 0 : -e.deltaY);
}, { passive: false });

// ---------- minimapa: aparece quando algum bloco ficou fora da tela ----------
// Tocar nele afasta o zoom até todos os blocos caberem.
const minimapa = document.getElementById('minimapa'), ctxMini = minimapa.getContext('2d');
const MINI_L = 96, MINI_A = 64;

function caixaBlocos() {
  return {
    x0: Math.min(...cadeias.map(c => c.x)), x1: Math.max(...cadeias.map(c => c.x + larguraCadeia(c))),
    y0: Math.min(...cadeias.map(c => c.y)), y1: Math.max(...cadeias.map(c => c.y + ALT_BLOCO)),
  };
}

function atualizarMinimapa() {
  const w = ws.clientWidth, h = ws.clientHeight;
  // parte visível, em coordenadas do workspace
  const vx0 = -vistaX / zoom, vy0 = -vistaY / zoom, vx1 = vx0 + w / zoom, vy1 = vy0 + h / zoom;
  const oculto = algumBlocoOculto();
  minimapa.classList.toggle('visivel', oculto && cadeias.length > 0);
  if (!oculto) return;

  // escala que faz caber blocos + área visível dentro do minimapa
  const b = caixaBlocos();
  const x0 = Math.min(b.x0, vx0), x1 = Math.max(b.x1, vx1), y0 = Math.min(b.y0, vy0), y1 = Math.max(b.y1, vy1);
  const dpr = devicePixelRatio || 1;
  minimapa.width = MINI_L * dpr; minimapa.height = MINI_A * dpr;
  const m = 4, k = Math.min((MINI_L - 2 * m) / (x1 - x0), (MINI_A - 2 * m) / (y1 - y0));
  const ox = m + ((MINI_L - 2 * m) - (x1 - x0) * k) / 2 - x0 * k, oy = m + ((MINI_A - 2 * m) - (y1 - y0) * k) / 2 - y0 * k;
  ctxMini.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctxMini.clearRect(0, 0, MINI_L, MINI_A);
  for (const c of cadeias) {   // cada cadeia vira um retângulo com a cor do 1º bloco
    const def = BLOCOS[c.blocos[0].tipo];
    ctxMini.fillStyle = def.grupo === 'funcao' ? CORES_FUNCAO[c.blocos[0].cor][0] : getComputedStyle(document.body).getPropertyValue(def.grupo === 'inicio' ? '--amarelo' : '--rosa');
    ctxMini.fillRect(ox + c.x * k, oy + c.y * k, Math.max(2, larguraCadeia(c) * k), Math.max(2, 64 * k));
  }
  ctxMini.strokeStyle = '#00a2e8'; ctxMini.lineWidth = 1.5;   // retângulo = o que está na tela
  ctxMini.strokeRect(ox + vx0 * k, oy + vy0 * k, (vx1 - vx0) * k, (vy1 - vy0) * k);
}

// anima a vista até (x, y, z)
function animarVista(x1, y1, z1) {
  const x0 = vistaX, y0 = vistaY, z0 = zoom, t0 = performance.now(), dur = 400;
  cancelAnimationFrame(animVolta);
  const passo = agora => {
    const k = Math.min(1, (agora - t0) / dur), e = 1 - (1 - k) ** 3;
    vistaX = x0 + (x1 - x0) * e; vistaY = y0 + (y1 - y0) * e; zoom = z0 + (z1 - z0) * e;
    desenharVista();
    if (k < 1) animVolta = requestAnimationFrame(passo);
  };
  animVolta = requestAnimationFrame(passo);
}

// zoom out (nunca aproxima além de 1x) até todos os blocos caberem, centralizados
function verTudo(animado = true) {
  const b = caixaBlocos(), m = 20, w = ws.clientWidth, h = ws.clientHeight;
  const z = limitar(Math.min((w - 2 * m) / (b.x1 - b.x0), (h - 2 * m) / (b.y1 - b.y0), 1), ZOOM_MIN, 1);
  const x = (w - (b.x0 + b.x1) * z) / 2, y = (h - (b.y0 + b.y1) * z) / 2;
  if (animado) animarVista(x, y, z);
  else { vistaX = x; vistaY = y; zoom = z; desenharVista(); }
}

// algum bloco (mesmo que só um pedaço) está fora da parte visível do workspace?
function algumBlocoOculto() {
  const vx0 = -vistaX / zoom, vy0 = -vistaY / zoom;
  const vx1 = vx0 + ws.clientWidth / zoom, vy1 = vy0 + ws.clientHeight / zoom;
  return cadeias.some(c => c.x < vx0 || c.x + larguraCadeia(c) > vx1 || c.y < vy0 || c.y + ALT_BLOCO > vy1);
}

minimapa.addEventListener('pointerdown', e => e.stopPropagation());
minimapa.addEventListener('click', verTudo);

// =====================================================================
// 6. SIMULADOR (iframe) — conversa por postMessage
// =====================================================================
const simFrame = document.getElementById('simFrame');
if (MODO_CENARIO) simFrame.src = 'about:blank';   // no construtor o simulador é o da página de cima
function paraSim(msg) {
  if (MODO_CENARIO) parent.postMessage(msg, '*');   // o construtor repassa ao simulador dele
  else simFrame.contentWindow?.postMessage(msg, '*');
}
let emExecucao = [];   // comandos enviados (para saber qual bloco destacar)
let reacoes = 0;       // reações nesta execução (limite contra robô preso batendo para sempre)
const MAX_REACOES = 50;

addEventListener('message', ({ data }) => {
  if (!data?.tipo) return;
  if (data.tipo === 'passo') destacar(emExecucao[data.indice]?.id);
  if (data.tipo === 'fim') destacar(null);
  if (data.tipo === 'tocou') {
    // o robô tocou num terreno: se existe "quando tocar" dele, a reação roda logo em seguida
    const r = cadeiaReacao(data.terreno);
    const cmds = r && reacoes++ < MAX_REACOES ? [{ cmd: 'pular', id: r.blocos[0].id }, ...comandos(r)] : [];
    emExecucao.splice(data.indice + 1, 0, ...cmds);   // mesma posição em que o simulador insere
    paraSim({ tipo: 'reagir', comandos: cmds.map(({ cmd, n }) => ({ cmd, n })) });
  }
  if (data.tipo === 'vitoria') aviso('⭐ Desafio completo! ⭐');
  if (data.tipo === 'caiu') aviso('💦 O robô caiu na água!');
  if (data.tipo === 'cenarioMudou') montarPaleta();
  // comandos vindos do construtor de cenários (botões do header dele)
  if (data.tipo === 'executarTodos') executarTodos();
  if (data.tipo === 'pararTudo') document.getElementById('btnParar').click();
});

function destacar(id) {
  wsInterno.querySelectorAll('.bloco').forEach(el => el.classList.toggle('ativo', +el.dataset.id === id));
}

function executar(cadeia) {
  reacoes = 0;
  emExecucao = comandos(cadeia);
  destacar(cadeia.blocos[0].id);
  paraSim({ tipo: 'executar', comandos: emExecucao.map(({ cmd, n }) => ({ cmd, n })) });
  if (porta) enviarParaRobo(cadeia);
}

// ▶ do header: executa todas as sequências que começam com Play (de cima para baixo)
function executarTodos() {
  const plays = cadeiasPlay();
  if (!plays.length) { aviso('Coloque um bloco ▶ no começo do programa'); return; }
  reacoes = 0;
  emExecucao = plays.flatMap(c => [{ cmd: 'pular', id: c.blocos[0].id }, ...comandos(c)]);
  paraSim({ tipo: 'executar', comandos: emExecucao.map(({ cmd, n }) => ({ cmd, n })) });
  if (porta) enviarParaRobo();
}

document.getElementById('btnPlay').onclick = executarTodos;
document.getElementById('btnParar').onclick = () => {
  paraSim({ tipo: 'reiniciar' }); destacar(null);
  if (porta) escreverLinha('parar');
};

document.getElementById('btnMenu').onclick = () => menu.classList.toggle('aberto');
document.addEventListener('pointerdown', e => {

addEventListener('resize', desenhar);

// =====================================================================
// 7. CONEXÃO COM O MICROCONTROLADOR (Web Serial — Chrome/Edge desktop e Android)
//    Protocolo: "inicio" \n  <linhas lua>  \n "fim"
// =====================================================================
let porta = null, escritor = null;

document.getElementById('btnConectar').onclick = async () => {
  menu.classList.remove('aberto');
  if (porta) { await desconectar(); return; }
  if (!('serial' in navigator)) { aviso('Este navegador não suporta Web Serial (use Chrome/Edge)'); return; }
  try {
    porta = await navigator.serial.requestPort();
    await porta.open({ baudRate: 115200 });
    escritor = porta.writable.getWriter();
    document.getElementById('btnConectar').classList.add('ligado');
    document.querySelector('#btnConectar b').textContent = 'Desconectar robô';
    document.getElementById('btnMenu').classList.add('verde');   // dica visual: robô ligado
    aviso('Robô conectado!');
    lerRespostas();
  } catch (err) { porta = null; aviso('Não conectou: ' + err.message); }
};

async function desconectar() {
  try { escritor?.releaseLock(); await porta.close(); } catch {}
  porta = escritor = null;
  document.getElementById('btnConectar').classList.remove('ligado');
  document.querySelector('#btnConectar b').textContent = 'Conectar robô';
  document.getElementById('btnMenu').classList.remove('verde');
  aviso('Desconectado');
}

const codificador = new TextEncoder();
async function escreverLinha(t) { await escritor?.write(codificador.encode(t + '\n')); }

async function enviarParaRobo(cadeia) {
  await escreverLinha('inicio');
  for (const linha of gerarLua(cadeia).split('\n')) if (linha && !linha.startsWith('--')) await escreverLinha(linha);
  await escreverLinha('fim');
}

async function lerRespostas() {   // mostra no console o que o firmware responder
  const leitor = porta.readable.pipeThrough(new TextDecoderStream()).getReader();
  try { for (;;) { const { value, done } = await leitor.read(); if (done) break; console.log('[robô]', value); } }
  catch {} finally { leitor.releaseLock(); }
}

// =====================================================================
function aviso(t) {
  const a = document.getElementById('aviso');
  a.textContent = t; a.classList.add('mostrar');
  clearTimeout(aviso.t); aviso.t = setTimeout(() => a.classList.remove('mostrar'), 2200);
}

// =====================================================================
// 8. DIVISOR: arrastar a borda muda o tamanho do simulador x workspace
// =====================================================================
const sim = document.getElementById('sim'), divisor = document.getElementById('divisor');
const MIN_SIM = 60, MIN_WS = 150;

function alturaSim(h) {
  const livre = sim.offsetHeight + ws.offsetHeight;   // espaço dividido entre os dois
  h = limitar(h, MIN_SIM, livre - MIN_WS);
  sim.style.flexBasis = h + 'px';
  desenharVista();
  try { localStorage.setItem('alturaSim', h); } catch {}
}

let divisao = null;
divisor.addEventListener('pointerdown', e => {
  divisao = { y0: e.clientY, h0: sim.offsetHeight };
  try { divisor.setPointerCapture(e.pointerId); } catch {}
  divisor.classList.add('ativo'); document.body.classList.add('redimensionando');
});
divisor.addEventListener('pointermove', e => { if (divisao) alturaSim(divisao.h0 + e.clientY - divisao.y0); });
const fimDivisao = () => {
  divisao = null;
  divisor.classList.remove('ativo'); document.body.classList.remove('redimensionando');
};
divisor.addEventListener('pointerup', fimDivisao);
divisor.addEventListener('pointercancel', fimDivisao);

try { const h = +localStorage.getItem('alturaSim'); if (h) sim.style.flexBasis = h + 'px'; } catch {}

// modo simplificado é o padrão; o avançado só se a pessoa escolheu antes
let modoSalvo = null;
try { modoSalvo = localStorage.getItem('modo'); } catch {}
carregarPrograma();
definirModoSimples(modoSalvo !== 'avancado');
// ao abrir a página (ou trocar de página), se algum bloco ficou escondido, já abre afastado mostrando todos
// (sem animação: a página já aparece assim, sem movimento que a criança não pediu)
addEventListener('load', () => { if (algumBlocoOculto()) verTudo(false); });
</script>
