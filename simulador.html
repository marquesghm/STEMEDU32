<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe9ff;touch-action:none}
  canvas{display:block}
  /* cubo gizmo: mostra para onde a câmera olha; tocar abre as visões */
  #gizmo{position:fixed;left:6px;bottom:6px;width:64px;height:64px;cursor:pointer;
    border-radius:50%;background:rgba(255,255,255,.35)}
  #visoes{position:fixed;left:76px;bottom:8px;display:none;gap:6px;padding:6px;border-radius:14px;
    background:#fffe;box-shadow:0 4px 14px rgba(0,0,0,.2)}
  #visoes.aberto{display:flex}
  #visoes button{display:flex;flex-direction:column;align-items:center;gap:2px;width:64px;height:56px;border:0;
    border-radius:10px;background:#eef6ff;font:600 11px system-ui;color:#335;cursor:pointer;padding:4px}
  #visoes button span{font-size:22px;line-height:24px}
  #visoes button:active{transform:scale(.94)}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gizmo" title="Escolher visão"></canvas>
<div id="visoes">
  <button id="camPadrao"><span>🎥</span>Normal</button>
  <button id="camCima"><span>🗺️</span>De cima</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const PASSO = 1;          // 1 unidade de grade por "frente(1)"
const VEL_MOVE = 1.6;     // unidades / s
const VEL_GIRO = Math.PI; // rad / s
// o robô começa de costas para a câmera (olhando para -Z): "frente" afasta ele de quem olha
const ROT_INICIAL = Math.PI;

// ---------- cena ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#cfe9ff');
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);

// câmera: 1 dedo gira, 2 dedos (pinça) dão zoom e arrastam; mouse: esquerdo gira, roda = zoom
const controles = new OrbitControls(camera, renderer.domElement);
controles.enableDamping = true;
controles.minDistance = 3;
controles.maxDistance = 25;
controles.maxPolarAngle = Math.PI / 2 - 0.05;   // não passa por baixo do chão
controles.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

// visões prontas (posição em relação ao centro); a de cima fica quase vertical
const VISOES = {
  padrao: () => new THREE.Vector3(5, 7, 7).multiplyScalar(innerWidth < innerHeight ? 1.4 : 1),
  cima:   () => new THREE.Vector3(0, 13, 0.01).multiplyScalar(innerWidth < innerHeight ? 1.3 : 1),
};
let transicao = null;
function irPara(nome) {
  transicao = { de: camera.position.clone(), para: VISOES[nome](),
                alvoDe: controles.target.clone(), t: 0, dur: 0.6 };
}
controles.addEventListener('start', () => { transicao = null; });   // mexeu com o dedo: cancela o voo
camera.position.copy(VISOES.padrao());

// ---------- cubo gizmo (canto inferior esquerdo) ----------
// Uma mini-cena com um cubo que gira igual à câmera principal. Tocar nele abre o menu de visões.
const gizmoCanvas = document.getElementById('gizmo'), menuVisoes = document.getElementById('visoes');
const gizmoRenderer = new THREE.WebGLRenderer({ canvas: gizmoCanvas, antialias: true, alpha: true });
gizmoRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
gizmoRenderer.setSize(64, 64, false);
const gizmoCena = new THREE.Scene();
const gizmoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);

function faceTextura(texto, cor) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = cor; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 8; g.strokeRect(4, 4, 120, 120);
  g.fillStyle = '#fff'; g.font = 'bold 30px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(texto, 64, 66);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.MeshBasicMaterial({ map: t });
}
// ordem das faces do BoxGeometry: +X, -X, +Y, -Y, +Z, -Z  (o robô começa olhando para -Z)
const cuboGizmo = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 1.1), [
  faceTextura('DIR', '#e5534b'), faceTextura('ESQ', '#e5534b'),
  faceTextura('CIMA', '#2fa84f'), faceTextura('BAIXO', '#2fa84f'),
  faceTextura('TRÁS', '#3d7fe0'), faceTextura('FRENTE', '#3d7fe0'),
]);
gizmoCena.add(cuboGizmo);

function desenharGizmo() {
  // a mini-câmera olha o cubo da mesma direção que a câmera principal olha a cena
  const dir = camera.position.clone().sub(controles.target).normalize();
  gizmoCam.position.copy(dir.multiplyScalar(3));
  gizmoCam.up.copy(camera.up);
  gizmoCam.lookAt(0, 0, 0);
  gizmoRenderer.render(gizmoCena, gizmoCam);
}

gizmoCanvas.addEventListener('click', () => menuVisoes.classList.toggle('aberto'));
for (const [id, visao] of [['camPadrao', 'padrao'], ['camCima', 'cima']])
  document.getElementById(id).onclick = () => { irPara(visao); menuVisoes.classList.remove('aberto'); };
// tocar na cena fecha o menu
renderer.domElement.addEventListener('pointerdown', () => menuVisoes.classList.remove('aberto'));

scene.add(new THREE.HemisphereLight('#ffffff', '#88aa66', 1.1));
const sol = new THREE.DirectionalLight('#ffffff', 1.4);
sol.position.set(4, 10, 3);
sol.castShadow = true;
sol.shadow.camera.left = sol.shadow.camera.bottom = -8;
sol.shadow.camera.right = sol.shadow.camera.top = 8;
scene.add(sol);

// chão quadriculado: TAM x TAM casas, o centro de cada casa fica em coordenadas inteiras (-5..5)
const TAM = 11, LIM = (TAM - 1) / 2;
const chao = new THREE.Mesh(new THREE.PlaneGeometry(TAM, TAM),
  new THREE.MeshLambertMaterial({ color: '#9fd67a' }));
chao.rotation.x = -Math.PI / 2;
chao.receiveShadow = true;
scene.add(chao);
const grade = new THREE.GridHelper(TAM, TAM, '#6aa84f', '#6aa84f');
grade.position.y = 0.01;
scene.add(grade);

// ---------- robô ----------
function criarRobo() {
  const r = new THREE.Group();
  const mat = c => new THREE.MeshLambertMaterial({ color: c });
  const corpo = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.45, 0.7), mat('#ff4fc8'));
  corpo.position.y = 0.38; corpo.castShadow = true; r.add(corpo);
  const cabeca = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.35, 0.5), mat('#ffffff'));
  cabeca.position.y = 0.78; cabeca.castShadow = true; r.add(cabeca);
  // olhos (frente = +Z)
  for (const x of [-0.13, 0.13]) {
    const olho = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 12), mat('#222'));
    olho.position.set(x, 0.8, 0.26); r.add(olho);
  }
  const antena = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 8), mat('#ffd400'));
  antena.position.y = 1.05; r.add(antena);
  r.userData.antena = antena;
  // luz da lâmpada (bloco lâmpada): começa apagada
  const brilho = new THREE.PointLight('#ffe066', 0, 2.5);
  brilho.position.y = 1.05; r.add(brilho);
  r.userData.brilho = brilho;
  // rodas
  for (const x of [-0.4, 0.4]) {
    const roda = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.1, 20), mat('#333'));
    roda.rotation.z = Math.PI / 2; roda.position.set(x, 0.18, 0); roda.castShadow = true;
    r.add(roda);
  }
  return r;
}
const robo = criarRobo();
scene.add(robo);

// lâmpada da cabeça: acesa = bolinha maior, brilhando, e iluminando em volta
function lampada(acesa) {
  const { antena, brilho } = robo.userData;
  antena.material.emissive.set(acesa ? '#ffd400' : '#000000');
  antena.scale.setScalar(acesa ? 1.8 : 1);
  brilho.intensity = acesa ? 3 : 0;
}

// piso preto na casa do robô: a luz troca preto <-> amarelo (fica assim até reiniciar).
// Para os sensores, um piso preto aceso conta como 'chao_amarelo'.
const COR_ACESO = '#ffd400';
let pisosAcesos = new Set();
function pintarPiso(k, aceso) {
  const m = malhas[k];
  if (!m) return;
  m.material.color.set(aceso ? COR_ACESO : TERRENOS.chao_preto.cor);
  m.material.emissive?.set(aceso ? '#6b5a00' : '#000000');
}
// troca a cor do piso embaixo do robô; devolve o terreno novo ('chao_amarelo'/'chao_preto') ou null
function iluminarPisos() {
  const k = chaveCasa(Math.round(robo.position.x), Math.round(robo.position.z));
  if (cenario[k] !== 'chao_preto') return null;
  if (pisosAcesos.has(k)) pisosAcesos.delete(k); else pisosAcesos.add(k);
  pintarPiso(k, pisosAcesos.has(k));
  return pisosAcesos.has(k) ? 'chao_amarelo' : 'chao_preto';
}
function apagarPisos() {
  for (const k of pisosAcesos) pintarPiso(k, false);
  pisosAcesos = new Set();
}

// rastro
const rastroMat = new THREE.LineBasicMaterial({ color: '#ff4fc8' });
let rastroPts = [], rastro = null;
function atualizarRastro() {
  if (rastro) scene.remove(rastro);
  rastro = new THREE.Line(new THREE.BufferGeometry().setFromPoints(rastroPts), rastroMat);
  scene.add(rastro);
}

// =====================================================================
// CENÁRIO: terrenos nas casas do chão. Fica salvo no navegador ('cenario')
// e é o mesmo na página de programar e no construtor de cenários.
// =====================================================================
const TERRENOS = {
  parede:        { cor: '#8a8f99' },
  estrela:       { cor: '#ffd400' },
  agua:          { cor: '#3aa0ff' },
  chao_vermelho: { cor: '#ff5a4f' },
  chao_azul:     { cor: '#3d8bff' },
  chao_verde:    { cor: '#2fbf5b' },
  chao_preto:    { cor: '#222222' },   // reage à luz: fica amarelo quando a lâmpada do robô acende perto
};
const chaveCasa = (x, z) => `${x},${z}`;
let cenario = {};                 // "x,z" -> tipo de terreno
const grupoCenario = new THREE.Group();
scene.add(grupoCenario);
const malhas = {};                // "x,z" -> objeto 3D (para esconder estrela coletada)

function criarTerreno(tipo) {
  const mat = new THREE.MeshLambertMaterial({ color: TERRENOS[tipo].cor });
  let m;
  if (tipo === 'parede') {
    m = new THREE.Mesh(new THREE.BoxGeometry(0.96, 0.8, 0.96), mat);
    m.position.y = 0.4;
  } else if (tipo === 'estrela') {
    // estrela de 5 pontas extrudada, em pé, girando
    const s = new THREE.Shape();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? 0.14 : 0.32, a = Math.PI / 2 + i * Math.PI / 5;
      i ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    m = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: 0.1, bevelEnabled: false }),
      new THREE.MeshLambertMaterial({ color: TERRENOS.estrela.cor, emissive: '#7a5a00' }));
    m.geometry.center();
    m.position.y = 0.5;
    m.userData.gira = true;
  } else if (tipo === 'agua') {
    m = new THREE.Mesh(new THREE.BoxGeometry(1, 0.04, 1),
      new THREE.MeshLambertMaterial({ color: TERRENOS.agua.cor, transparent: true, opacity: 0.85 }));
    m.position.y = 0.02;
  } else {   // chão colorido
    m = new THREE.Mesh(new THREE.BoxGeometry(1, 0.03, 1), mat);
    m.position.y = 0.015;
  }
  m.castShadow = tipo === 'parede';
  m.receiveShadow = true;
  return m;
}

function desenharCenario() {
  grupoCenario.clear();
  for (const k in malhas) delete malhas[k];
  for (const [chave, tipo] of Object.entries(cenario)) {
    if (!TERRENOS[tipo]) continue;
    const [x, z] = chave.split(',').map(Number);
    const m = criarTerreno(tipo);
    m.position.x = x; m.position.z = z;
    grupoCenario.add(m);
    malhas[chave] = m;
  }
}

function carregarCenario() {
  try { cenario = JSON.parse(localStorage.getItem('cenario') || '{}'); } catch { cenario = {}; }
  desenharCenario();
}
function salvarCenario() {
  try { localStorage.setItem('cenario', JSON.stringify(cenario)); } catch {}
  parent.postMessage({ tipo: 'cenarioMudou', cenario }, '*');
}
addEventListener('storage', e => { if (e.key === 'cenario') carregarCenario(); });

// ---------- modo edição (construtor de cenários: simulador.html?editar=1) ----------
// Com uma ferramenta escolhida, tocar/arrastar no chão pinta terrenos; sem ferramenta, a câmera gira.
const EDITAR = new URLSearchParams(location.search).has('editar');
let ferramenta = null;            // tipo de terreno, 'apagar' ou null (mão = mexer câmera)
const raio = new THREE.Raycaster(), ponteiro = new THREE.Vector2();

function casaEm(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ponteiro.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  raio.setFromCamera(ponteiro, camera);
  const hit = raio.intersectObject(chao)[0];
  if (!hit) return null;
  const x = Math.round(hit.point.x), z = Math.round(hit.point.z);
  return Math.abs(x) <= LIM && Math.abs(z) <= LIM ? { x, z } : null;
}

let pintando = false, ultimaCasa = '';
function pintar(ev) {
  const c = casaEm(ev);
  if (!c) return;
  const k = chaveCasa(c.x, c.z);
  if (k === ultimaCasa) return;
  ultimaCasa = k;
  if (c.x === 0 && c.z === 0 && ferramenta !== 'apagar') return;   // casa de saída do robô fica livre
  if (ferramenta === 'apagar') delete cenario[k]; else cenario[k] = ferramenta;
  desenharCenario();
  salvarCenario();
}
if (EDITAR) {
  renderer.domElement.addEventListener('pointerdown', ev => {
    if (!ferramenta) return;
    pintando = true; ultimaCasa = '';
    pintar(ev);
  });
  renderer.domElement.addEventListener('pointermove', ev => { if (pintando) pintar(ev); });
  addEventListener('pointerup', () => { if (pintando) registrarCenario(); pintando = false; });
}

// ---------- desfazer / refazer do construtor (só terrenos; o editor tem o histórico dos blocos) ----------
// Cada "pincelada" (tocar ou arrastar até soltar o dedo) vira um passo do histórico.
let histCenario = [], posCenario = -1;
function registrarCenario() {
  const json = JSON.stringify(cenario);
  if (histCenario[posCenario] === json) return;
  histCenario = histCenario.slice(0, posCenario + 1);
  histCenario.push(json);
  if (histCenario.length > 60) histCenario.shift();
  posCenario = histCenario.length - 1;
  avisarHistoricoCenario();
}
function andarCenario(passo) {
  const p = posCenario + passo;
  if (p < 0 || p >= histCenario.length) return;
  posCenario = p;
  cenario = JSON.parse(histCenario[p]);
  desenharCenario();
  salvarCenario();
  avisarHistoricoCenario();
}
function avisarHistoricoCenario() {
  parent.postMessage({ tipo: 'historicoCenario', podeDesfazer: posCenario > 0,
                       podeRefazer: posCenario < histCenario.length - 1 }, '*');
}

function escolherFerramenta(f) {
  ferramenta = f;
  // pintando com 1 dedo: a câmera só gira/zoom com 2 dedos (e o mouse sem ferramenta)
  controles.enableRotate = !f;
  controles.touches = f ? { ONE: null, TWO: THREE.TOUCH.DOLLY_PAN } : { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
}

// =====================================================================
// EXECUÇÃO
// frente/tras andam uma casa por vez para conferir o terreno de cada casa.
// Ao tocar num terreno o simulador avisa a página ('tocou') e espera a resposta
// ('reagir'), que pode trazer comandos de reação para rodar logo em seguida.
// =====================================================================
let fila = [], atual = null, indice = -1, estrelasPegas = new Set();

function reiniciar() {
  fila = []; atual = null; indice = -1;
  robo.position.set(0, 0, 0); robo.rotation.y = ROT_INICIAL; robo.visible = true;
  lampada(false);
  apagarPisos();
  estrelasPegas = new Set();
  pendentes = []; ofsReacao = 0;
  paredeNaFrente = false;   // se já começar de frente para uma parede, o sensor dispara logo no início
  for (const m of Object.values(malhas)) m.visible = true;
  rastroPts = [robo.position.clone().setY(0.03)]; atualizarRastro();
}

function direcaoRobo() {
  return new THREE.Vector3(Math.round(Math.sin(robo.rotation.y)), 0, Math.round(Math.cos(robo.rotation.y)));
}

// Sensor de parede: dispara no momento em que passa a existir uma parede na casa
// da frente do robô (depois de andar ou girar). Bater na parede não dispara.
let paredeNaFrente = false;
function temParedeNaFrente() {
  const f = robo.position.clone().setY(0).add(direcaoRobo()).round();
  return cenario[chaveCasa(f.x, f.z)] === 'parede';
}
function verificarFrente() {
  const agora = temParedeNaFrente(), apareceu = agora && !paredeNaFrente;
  paredeNaFrente = agora;
  if (apareceu) tocou('parede');
  return apareceu;
}

// Sensores "esperam a vez": o que o robô tocar durante um comando fica guardado e as
// reações rodam só quando o comando termina (nunca no meio dele), na ordem em que aconteceram.
let pendentes = [];      // terrenos tocados durante o comando atual
let ofsReacao = 0;       // comandos de reação já inseridos depois do comando atual

function proximo() {
  if (pendentes.length) { tocou(pendentes.shift()); return; }
  ofsReacao = 0;
  if (verificarFrente()) return;   // reação de parede roda antes do próximo comando
  indice++;
  if (indice >= fila.length) { atual = null; parent.postMessage({ tipo: 'fim' }, '*'); return; }
  const { cmd, n } = fila[indice];
  parent.postMessage({ tipo: 'passo', indice }, '*');
  if (cmd === 'frente' || cmd === 'tras') {
    if (n > 0) { andarUmaCasa(cmd === 'frente' ? 1 : -1, n); return; }
    atual = { tipo: 'espera', t: 0, dur: 0.1 };
  } else if (cmd === 'luz') {          // n = segundos acesa
    lampada(true);
    // se o piso embaixo trocou de cor, o sensor da cor nova dispara quando a luz apagar
    atual = { tipo: 'luz', t: 0, dur: Math.max(0.05, n), trocou: iluminarPisos() };
  } else if (cmd === 'esquerda' || cmd === 'direita') {
    const ang = (cmd === 'esquerda' ? 1 : -1) * n * Math.PI / 2;
    atual = { tipo: 'girar', de: robo.rotation.y, para: robo.rotation.y + ang, t: 0,
              dur: Math.max(0.1, Math.abs(ang) / VEL_GIRO) };
  } else if (cmd === 'sensor') {       // começo de uma reação: pausa para a criança ver o salto
    atual = { tipo: 'espera', t: 0, dur: 0.7 };
  } else {
    atual = { tipo: 'espera', t: 0, dur: 0.2 };
  }
}

// anda 1 casa (sentido +1/-1); "restam" = casas que ainda faltam neste comando
function andarUmaCasa(sentido, restam) {
  const de = robo.position.clone().setY(0);
  const para = de.clone().addScaledVector(direcaoRobo(), sentido * PASSO).round();
  const k = chaveCasa(para.x, para.z);
  const fora = Math.abs(para.x) > LIM || Math.abs(para.z) > LIM;
  if (fora || cenario[k] === 'parede') {
    // bate e volta: não entra na casa
    atual = { tipo: 'bater', de, para: de.clone().lerp(para, 0.3), t: 0, dur: 0.35 };
    return;
  }
  atual = { tipo: 'mover', de, para, t: 0, dur: PASSO / VEL_MOVE, sentido, restam: restam - 1 };
}

function chegouNaCasa(a) {
  robo.position.y = 0;
  rastroPts.push(robo.position.clone().setY(0.03)); atualizarRastro();
  const k = chaveCasa(Math.round(robo.position.x), Math.round(robo.position.z));
  let tipo = estrelasPegas.has(k) ? null : cenario[k];
  if (tipo === 'chao_preto' && pisosAcesos.has(k)) tipo = 'chao_amarelo';
  if (tipo === 'agua') {   // caiu na água: afunda e o programa acaba
    atual = { tipo: 'afundar', t: 0, dur: 0.6 };
    return;
  }
  if (tipo === 'estrela') {
    estrelasPegas.add(k);
    if (malhas[k]) malhas[k].visible = false;
    const total = Object.values(cenario).filter(t => t === 'estrela').length;
    if (estrelasPegas.size === total) parent.postMessage({ tipo: 'vitoria' }, '*');
  }
  if (tipo) pendentes.push(tipo);   // a reação espera o comando terminar
  if (a.restam > 0) andarUmaCasa(a.sentido, a.restam); else proximo();
}

// pausa e pergunta à página se há reação para esse terreno.
// 'indice' = posição depois da qual a reação entra (após o comando e reações anteriores)
function tocou(tipo) {
  atual = { tipo: 'aguardando' };
  parent.postMessage({ tipo: 'tocou', terreno: tipo, indice: indice + ofsReacao }, '*');
}

const relogio = new THREE.Clock();
function animar() {
  requestAnimationFrame(animar);
  const dt = Math.min(relogio.getDelta(), 0.1);
  if (atual && atual.tipo !== 'aguardando') {
    atual.t = Math.min(atual.dur, atual.t + dt);
    const k = atual.t / atual.dur, e = k < .5 ? 2*k*k : 1 - (-2*k+2)**2/2; // ease
    if (atual.tipo === 'mover') {
      robo.position.lerpVectors(atual.de, atual.para, e);
      robo.position.y = Math.abs(Math.sin(k * Math.PI * 2)) * 0.05; // pulinho
    } else if (atual.tipo === 'bater') {
      robo.position.lerpVectors(atual.de, atual.para, Math.sin(k * Math.PI));   // vai e volta
    } else if (atual.tipo === 'girar') {
      robo.rotation.y = atual.de + (atual.para - atual.de) * e;
    } else if (atual.tipo === 'afundar') {
      robo.position.y = -0.9 * e;
    }
    if (atual.t >= atual.dur) {
      const a = atual;
      if (a.tipo === 'mover') chegouNaCasa(a);
      else if (a.tipo === 'bater') { robo.position.copy(a.de); proximo(); }
      else if (a.tipo === 'afundar') {
        robo.visible = false; atual = null; fila = [];
        parent.postMessage({ tipo: 'caiu' }, '*');
        parent.postMessage({ tipo: 'fim' }, '*');
      }
      else if (a.tipo === 'luz') { lampada(false); if (a.trocou) pendentes.push(a.trocou); proximo(); }
      else proximo();
    }
  }
  for (const m of grupoCenario.children) if (m.userData.gira) m.rotation.y += dt * 1.5;
  if (transicao) {   // voo suave até a visão escolhida (e o centro volta para o meio)
    transicao.t = Math.min(transicao.dur, transicao.t + dt);
    const k = transicao.t / transicao.dur, e = 1 - (1 - k) ** 3;
    camera.position.lerpVectors(transicao.de, transicao.para, e);
    controles.target.lerpVectors(transicao.alvoDe, new THREE.Vector3(), e);
    if (k >= 1) transicao = null;
  }
  controles.update();
  renderer.render(scene, camera);
  desenharGizmo();
}

function redimensionar() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', redimensionar);

addEventListener('message', ({ data }) => {
  if (!data || !data.tipo) return;
  if (data.tipo === 'executar') { reiniciar(); fila = data.comandos || []; proximo(); }
  else if (data.tipo === 'parar') { fila = []; atual = null; }
  else if (data.tipo === 'reiniciar') reiniciar();
  else if (data.tipo === 'reagir' && atual?.tipo === 'aguardando') {
    // reação entra logo depois do comando atual (o resto do comando atual é interrompido)
    const cmds = data.comandos || [];
    fila.splice(indice + 1 + ofsReacao, 0, ...cmds);
    ofsReacao += cmds.length;
    proximo();
  }
  else if (data.tipo === 'ferramenta') escolherFerramenta(data.ferramenta);
  else if (data.tipo === 'limparCenario') { cenario = {}; desenharCenario(); salvarCenario(); registrarCenario(); }
  else if (data.tipo === 'desfazerCenario') andarCenario(-1);
  else if (data.tipo === 'refazerCenario') andarCenario(+1);
  else if (data.tipo === 'recarregarCenario') carregarCenario();
});

redimensionar();
carregarCenario();
if (EDITAR) registrarCenario();   // estado inicial do histórico do construtor
reiniciar();
if (EDITAR) camera.position.copy(VISOES.cima());   // construtor começa olhando de cima
animar();
parent.postMessage({ tipo: 'pronto' }, '*');
</script>
