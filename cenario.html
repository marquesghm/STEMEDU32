<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ff9d1a">
<title>Construir cenário</title>
<style>
  :root{ --laranja:#ff9d1a; --texto:#333; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:#fff8e6;color:var(--texto);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;height:100dvh}

  header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--laranja)}
  header h1{font-size:17px;margin:0;flex:1}
  .btn{border:0;border-radius:14px;min-width:48px;height:48px;padding:0 12px;font-size:22px;
    background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2);cursor:pointer}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
  .btn.verde{background:#3ec43e;color:#fff}
  .btn.vermelho{background:#ff4b4b;color:#fff}
  .btn.azul{background:#3d8bff;color:#fff}
  .btn.selecionado{outline:4px solid #183e70;outline-offset:1px;filter:brightness(.88)}

  /* cenário 3D (simulador em modo edição) */
  #sim{flex:0 1 42%;min-height:120px;position:relative}

  /* desfazer / refazer do construtor: histórico próprio, só dos terrenos (fica no simulador) */
  .historico{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column-reverse;gap:6px}
  .historico button{width:48px;height:48px;border:0;border-radius:14px;background:#fffe;font:700 26px system-ui;
    color:#444;box-shadow:0 3px 0 rgba(0,0,0,.2);cursor:pointer;padding:0}
  .historico button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
  .historico button:disabled{opacity:.35;cursor:default}
  #cBtnRefazer{display:none}
  #cBtnRefazer.visivel{display:block}
  #sim iframe, #ws iframe{border:0;width:100%;height:100%;display:block}

  /* paleta de terrenos: tocar escolhe a ferramenta; depois tocar/arrastar no chão pinta */
  #terrenos{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:8px;background:#fff0dc;
    border-top:3px solid #f5d2a3;border-bottom:3px solid #f5d2a3;scrollbar-width:none}
  #terrenos button{flex:0 0 auto;width:56px;height:56px;border-radius:14px;border:3px solid transparent;
    background:#fff;font-size:26px;cursor:pointer;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:0;padding:0;box-shadow:0 2px 0 rgba(0,0,0,.12)}
  #terrenos button small{font:600 9px system-ui;color:#665}
  #terrenos button.sel{border-color:var(--laranja);background:#fff3e0}
  #terrenos .sep{flex:0 0 2px;background:#f5d2a3;margin:4px 2px}

  /* janelinha de orientação do robô (abre ao tocar no robô com a ferramenta Robô) */
  #menuRobo{position:fixed;z-index:30;display:none;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);
    gap:4px;padding:8px;background:#fff;border-radius:16px;border:3px solid var(--laranja);box-shadow:0 6px 20px rgba(0,0,0,.25)}
  #menuRobo.aberto{display:grid}
  #menuRobo button{border:3px solid #f5d2a3;border-radius:12px;background:#fff;font:700 24px system-ui;cursor:pointer;padding:0}
  #menuRobo button.atual{border-color:var(--laranja);background:#fff3e0}
  #menuRobo .centro{display:flex;align-items:center;justify-content:center;font-size:26px}

  /* workspace = o próprio editor em modo cenário */
  #ws{flex:1 1 auto;min-height:200px}
</style>
</head>
<body>

<header>
  <button class="btn" id="btnVoltar" title="Voltar para programar">←</button>
  <h1>Construir cenário</h1>
  <button class="btn verde" id="btnPlay" title="Testar">▶</button>
  <button class="btn azul" id="btnPasso" title="Passo a passo">⏭&#xFE0E;</button>
  <button class="btn vermelho" id="btnParar" title="Parar">⏹</button>
</header>

<div id="sim"><iframe id="simFrame" src="simulador.html?editar=1" title="Cenário 3D"></iframe>
  <div class="historico">
    <button id="cBtnDesfazer" title="Desfazer" disabled>↶</button>
    <button id="cBtnRefazer" title="Refazer">↷</button>
  </div>
</div>

<div id="terrenos">
  <button data-f="" class="sel" title="Mexer a câmera">✋<small>Mover</small></button>
  <div class="sep"></div>
  <button data-f="robo" title="Tocar numa casa leva o robô; tocar nele escolhe para onde ele olha">🤖<small>Robô</small></button>
  <div class="sep"></div>
  <button data-f="parede">🧱<small>Parede</small></button>
  <button data-f="estrela">⭐<small>Estrela</small></button>
  <button data-f="agua">💧<small>Água</small></button>
  <button data-f="chao_vermelho">🟥<small>Vermelho</small></button>
  <button data-f="chao_azul">🟦<small>Azul</small></button>
  <button data-f="chao_verde">🟩<small>Verde</small></button>
  <button data-f="chao_preto">⬛<small>Preto</small></button>
  <div class="sep"></div>
  <button data-f="apagar">🧽<small>Apagar</small></button>
  <button id="btnLimpar" title="Apagar todo o cenário">🗑️<small>Limpar</small></button>
</div>

<div id="ws"><iframe id="wsFrame" src="index.html?modo=cenario" title="Programar reações"></iframe></div>

<div id="menuRobo">
  <span></span><button data-rot="0">↑</button><span></span>
  <button data-rot="3">←</button><span class="centro">🤖</span><button data-rot="1">→</button>
  <span></span><button data-rot="2">↓</button><span></span>
</div>

<script>
// Esta página só junta as partes: o simulador (editando o cenário) e o editor de blocos.
// Tudo que um manda para o outro passa por aqui.
const simFrame = document.getElementById('simFrame'), wsFrame = document.getElementById('wsFrame');
const paraSim = msg => simFrame.contentWindow?.postMessage(msg, '*');
const paraWs  = msg => wsFrame.contentWindow?.postMessage(msg, '*');

let historicoBlocos = { podeDesfazer:false, podeRefazer:false };
let historicoCenario = { podeDesfazer:false, podeRefazer:false };
let ultimoHistorico = 'cenario';
function atualizarBotoesHistorico() {
  const podeDesfazer = historicoBlocos.podeDesfazer || historicoCenario.podeDesfazer;
  const podeRefazer = historicoBlocos.podeRefazer || historicoCenario.podeRefazer;
  document.getElementById('cBtnDesfazer').disabled = !podeDesfazer;
  const refazer = document.getElementById('cBtnRefazer');
  refazer.disabled = !podeRefazer;
  refazer.classList.toggle('visivel', podeRefazer);
}
function fonteHistorico(passo) {
  const primeiro = ultimoHistorico === 'blocos' ? historicoBlocos : historicoCenario;
  const outro = ultimoHistorico === 'blocos' ? historicoCenario : historicoBlocos;
  const chave = passo === -1 ? 'podeDesfazer' : 'podeRefazer';
  return primeiro[chave] ? ultimoHistorico : outro[chave] ? (ultimoHistorico === 'blocos' ? 'cenario' : 'blocos') : null;
}
function atualizarEstadoExecucao(estado) {
  const play = document.getElementById('btnPlay'), passo = document.getElementById('btnPasso');
  play.classList.toggle('selecionado', estado === 'rodando');
  passo.classList.toggle('selecionado', estado === 'passo');
  play.setAttribute('aria-pressed', String(estado === 'rodando'));
  passo.setAttribute('aria-pressed', String(estado === 'passo'));
  play.title = estado === 'passo' ? 'Continuar execução' : estado === 'rodando' ? 'Executando' : 'Testar';
  passo.title = estado === 'passo' ? 'Avançar um passo' : estado === 'rodando' ? 'Pausar ao fim do passo' : 'Passo a passo';
}

addEventListener('message', ({ source, data }) => {
  if (!data?.tipo) return;
  if (data.tipo === 'toqueSim') { menuRobo.classList.remove('aberto'); return; }
  if (data.tipo === 'menuRobo') { abrirMenuRobo(data); return; }
  if (data.tipo === 'historico' && source === wsFrame.contentWindow) {
    historicoBlocos = { podeDesfazer:data.podeDesfazer, podeRefazer:data.podeRefazer };
    ultimoHistorico = 'blocos'; atualizarBotoesHistorico(); return;
  }
  if (data.tipo === 'historicoCenario' && source === simFrame.contentWindow) {
    historicoCenario = { podeDesfazer:data.podeDesfazer, podeRefazer:data.podeRefazer };
    ultimoHistorico = 'cenario'; atualizarBotoesHistorico(); return;
  }
  if (data.tipo === 'estadoExecucao' && source === wsFrame.contentWindow) {
    atualizarEstadoExecucao(data.estado); return;
  }
  if (data.tipo === 'historico' || data.tipo === 'historicoCenario') {
    return;
  }
  if (source === simFrame.contentWindow) paraWs(data);       // passo, fim, tocou, vitoria, cenarioMudou...
  else if (source === wsFrame.contentWindow) paraSim(data);  // executar, reagir, reiniciar...
});

// ferramentas de terreno
const botoes = document.querySelectorAll('#terrenos button[data-f]');
botoes.forEach(b => b.onclick = () => {
  botoes.forEach(x => x.classList.toggle('sel', x === b));
  paraSim({ tipo: 'ferramenta', ferramenta: b.dataset.f || null });
});
document.getElementById('btnLimpar').onclick = () => {
  if (confirm('Apagar todo o cenário?')) paraSim({ tipo: 'limparCenario' });
};

// janelinha de orientação do robô: posiciona junto do robô (coordenadas vindas do simulador)
const menuRobo = document.getElementById('menuRobo');
function abrirMenuRobo({ x, y, rot }) {
  menuRobo.querySelectorAll('button').forEach(b => b.classList.toggle('atual', +b.dataset.rot === rot));
  menuRobo.classList.add('aberto');
  const f = simFrame.getBoundingClientRect(), m = menuRobo.getBoundingClientRect();
  menuRobo.style.left = Math.min(Math.max(8, f.left + x - m.width / 2), innerWidth - m.width - 8) + 'px';
  menuRobo.style.top = Math.min(Math.max(8, f.top + y - m.height / 2), innerHeight - m.height - 8) + 'px';
}
menuRobo.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  paraSim({ tipo: 'orientarRobo', rot: +b.dataset.rot });
  menuRobo.classList.remove('aberto');
});
document.addEventListener('pointerdown', e => { if (!menuRobo.contains(e.target)) menuRobo.classList.remove('aberto'); }, true);

document.getElementById('btnPlay').onclick = () => paraWs({ tipo: 'executarTodos' });
document.getElementById('btnPasso').onclick = () => paraWs({ tipo: 'passoAPasso' });
document.getElementById('cBtnDesfazer').onclick = () => {
  const alvo = fonteHistorico(-1); if (!alvo) return;
  ultimoHistorico = alvo;
  (alvo === 'blocos' ? paraWs : paraSim)({ tipo: alvo === 'blocos' ? 'desfazer' : 'desfazerCenario' });
};
document.getElementById('cBtnRefazer').onclick = () => {
  const alvo = fonteHistorico(+1); if (!alvo) return;
  ultimoHistorico = alvo;
  (alvo === 'blocos' ? paraWs : paraSim)({ tipo: alvo === 'blocos' ? 'refazer' : 'refazerCenario' });
};
document.getElementById('btnParar').onclick = () => paraWs({ tipo: 'pararTudo' });
document.getElementById('btnVoltar').onclick = () => { location.href = 'index.html'; };
</script>
</body>
</html>
